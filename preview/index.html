<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Echo">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Echo flame preview — a wandering fire spirit.">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
  <title>Echo</title>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      color: #fff;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 10px calc(8px + var(--sab));
      padding-left: max(10px, var(--sal));
      padding-right: max(10px, var(--sar));
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 2;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 40%, rgba(0,0,0,0));
      pointer-events: none;
    }
    #bar > * { pointer-events: auto; }
    body.hide-ui #bar { display: none; }
    #autoBtn { flex: 0 0 auto; }
    #pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 18px), transparent);
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 18px), transparent);
    }
    #pills::-webkit-scrollbar { display: none; }
    button.pill {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.84);
      border-radius: 999px;
      padding: 7px 11px;
      font: 600 12px/1.15 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      letter-spacing: 0.01em;
      white-space: nowrap;
      margin: 0;
      cursor: pointer;
    }
    button.pill:active { transform: scale(0.97); }
    button.pill[aria-pressed="true"] {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.28);
      color: #fff;
    }
    #autoBtn[aria-pressed="true"] { background: rgba(255,255,255,0.28); }
    #fps {
      display: none;
      position: fixed;
      top: calc(6px + var(--sat));
      right: max(8px, var(--sar));
      font: 500 11px/1.2 ui-monospace, Menlo, monospace;
      color: rgba(255,255,255,0.4);
      z-index: 2;
      pointer-events: none;
    }
    body.debug #fps { display: block; }
  </style>
</head>
<body>
  <canvas id="c" aria-label="Echo"></canvas>
  <div id="bar">
    <button type="button" class="pill" id="autoBtn" aria-pressed="false">Auto</button>
    <div id="pills" role="toolbar" aria-label="Expressions"></div>
  </div>
  <div id="fps"></div>
  <script>
  (function () {
    'use strict';

    // Sprite landmarks, in flame-body.png pixels (cropped lively-white-v5, no face).
    var IMG_W = 720, IMG_H = 939;
    var FACE_CX = 358.0, FACE_CY = 510.9, EYE_D = 35.4, GAP = 1.20;
    var SOLID_L = 255, SOLID_R = 459, SOLID_T = 253, SOLID_B = 687;
    var BULB_CX = 358.0, BULB_CY = 500.1;
    var TIP_X = 361, TIP_Y = 253;
    var DRIPS = [{ x: 345, y: 632 }, { x: 368, y: 685 }];
    var MOUTH_FRAC = 0.70, MOUTH_THICK = 0.22;
    var SOLID_W = SOLID_R - SOLID_L;

    var EXPRESSION_NAMES = [
      'happy', 'sad', 'veryHappy', 'wavy', 'content', 'disappointed',
      'angry', 'dizzy', 'squint', 'wink', 'unamused', 'worried'
    ];

    var LABELS = {
      happy: 'Happy', sad: 'Sad', veryHappy: 'Very happy', wavy: 'Wavy',
      content: 'Content', disappointed: 'Disappointed', angry: 'Angry',
      dizzy: 'Dizzy', squint: 'Squint', wink: 'Wink',
      unamused: 'Unamused', worried: 'Worried',
      neutral: 'Neutral', talking: 'Talking'
    };

    var ALIASES = {
      'very-happy': 'veryHappy', veryhappy: 'veryHappy', 'very happy': 'veryHappy',
      smile: 'happy', frown: 'sad',
      default: 'neutral', idle: 'neutral',
      talk: 'talking',
      mad: 'angry', wow: 'veryHappy',
      bored: 'unamused', deadpan: 'unamused',
      nervous: 'worried', concern: 'worried'
    };

    // Eye kinds: circle, happyArc, sadArc, caret, chevron, ex, flat, slit
    function baseParams() {
      return {
        lCircle: 1, rCircle: 1,
        lHappy: 0, rHappy: 0,
        lSad: 0, rSad: 0,
        lCaret: 0, rCaret: 0,
        lChev: 0, rChev: 0, lChevDir: 1, rChevDir: -1,
        lEx: 0, rEx: 0,
        lFlat: 0, rFlat: 0,
        lSlit: 0, rSlit: 0, lSlitRot: 0.45, rSlitRot: -0.45,
        brow: 0,
        mouthCurve: 1,
        mouthW: MOUTH_FRAC,
        mouthThick: MOUTH_THICK,
        mouthWave: 0,
        mouthOpen: 0,
        lookBiasX: 0, lookBiasY: 0
      };
    }

    function pCircle(extra) {
      return Object.assign(baseParams(), extra || {});
    }

    var EXPR = {};
    EXPR.happy = pCircle({ mouthCurve: 1, mouthW: 0.70 });
    EXPR.neutral = pCircle({ mouthCurve: 0.45, mouthW: 0.55, mouthThick: 0.20 });
    EXPR.sad = pCircle({ mouthCurve: -1, mouthW: 0.70, lookBiasY: 0.22 });
    EXPR.veryHappy = pCircle({
      lCircle: 0, rCircle: 0, lCaret: 1, rCaret: 1,
      mouthCurve: 1, mouthW: 0.75
    });
    EXPR.wavy = pCircle({ mouthCurve: 0.25, mouthW: 0.80, mouthWave: 1 });
    EXPR.content = pCircle({
      lCircle: 0, rCircle: 0, lHappy: 1, rHappy: 1,
      mouthCurve: 1, mouthW: 0.75
    });
    EXPR.disappointed = pCircle({
      lCircle: 0, rCircle: 0, lSad: 1, rSad: 1,
      mouthCurve: -1, mouthW: 0.70, lookBiasY: 0.2
    });
    EXPR.angry = pCircle({
      lCircle: 0, rCircle: 0, lSlit: 1, rSlit: 1,
      mouthCurve: -1, mouthW: 0.65, brow: 0.35
    });
    EXPR.dizzy = pCircle({
      lCircle: 0, rCircle: 0, lEx: 1, rEx: 1,
      mouthCurve: -0.85, mouthW: 0.62
    });
    EXPR.squint = pCircle({
      lCircle: 0, rCircle: 0, lChev: 1, rChev: 1,
      lChevDir: 1, rChevDir: -1,
      mouthCurve: 1, mouthW: 0.70
    });
    EXPR.wink = pCircle({
      lCircle: 0, rCircle: 1, lChev: 1, rChev: 0,
      lChevDir: 1,
      mouthCurve: 1, mouthW: 0.70
    });
    EXPR.unamused = pCircle({
      lCircle: 0, rCircle: 0, lFlat: 1, rFlat: 1,
      mouthCurve: 0, mouthW: 0.72, mouthThick: 0.20
    });
    EXPR.worried = pCircle({
      mouthCurve: -1, mouthW: 0.70, brow: 1, lookBiasY: 0.12
    });
    EXPR.talking = pCircle({
      mouthCurve: 0.35, mouthW: 0.62, mouthOpen: 0.7, mouthThick: 0.20
    });

    var HOLD = {
      wink: [1.15, 1.7],
      dizzy: [1.6, 2.4],
      talking: [2.4, 3.6],
      _default: [2.6, 4.4]
    };

    function resolveName(name) {
      if (name == null) return null;
      var key = String(name).trim();
      if (EXPR[key]) return key;
      var lower = key.toLowerCase();
      if (EXPR[lower]) return lower;
      if (ALIASES[lower]) return ALIASES[lower];
      if (ALIASES[key]) return ALIASES[key];
      return null;
    }

    var q = new URLSearchParams(location.search);
    function flag(k) {
      if (!q.has(k)) return false;
      var v = q.get(k);
      return v !== '0' && v !== 'false' && v !== 'no';
    }

    var startName = resolveName(q.get('expr')) || 'happy';
    var autoOn = flag('auto');
    var stillMode = flag('still');
    var debugOn = flag('debug');
    var hideUi = flag('hideui') || flag('demo') || q.get('ui') === '0';

    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    var fpsEl = document.getElementById('fps');
    var barEl = document.getElementById('bar');
    var pillsEl = document.getElementById('pills');
    var autoBtn = document.getElementById('autoBtn');

    if (debugOn) document.body.classList.add('debug');
    if (hideUi) document.body.classList.add('hide-ui');

    var dpr = 1;
    var W = 1, H = 1, S = 1;
    var safe = { top: 0, bottom: 0, left: 0, right: 0 };

    var cur = baseParams();
    var target = Object.assign(baseParams(), EXPR[startName]);
    var exprName = startName;
    var talkHeld = false;
    var autoTimer = 0;
    var autoHold = 3;

    var pos = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0 };
    var nextTarget = { x: 0, y: 0 };
    var phase = stillMode ? 'still' : 'pause';
    var phaseUntil = 0;
    var lean = 0;
    var squash = 0;

    var look = { x: 0, y: 0, tx: 0, ty: 0, until: 0 };
    var blink = 0;
    var blinkUntil = 0;
    var blinkState = 'open';
    var doublePending = false;

    var follow = null;
    var pokeUntil = 0;

    var embers = [];
    var drops = [];
    var smokes = [];
    var nextEmber = 0;
    var nextDrop = 0;
    var nextSmoke = 0;

    var time = 0;
    var last = 0;
    var fpsAcc = 0, fpsFrames = 0, fpsVal = 60;

    var bodyImg = null;
    var glowCvs = null;
    var softDot = null;
    var ready = false;
    var flickerN = 0;

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function expApproach(curV, tgt, rate, dt) {
      return curV + (tgt - curV) * (1 - Math.exp(-rate * dt));
    }

    function bodyScale() {
      return (124 * S) / SOLID_W;
    }

    function extents() {
      var sc = bodyScale();
      return {
        left: (FACE_CX - SOLID_L) * sc + 22,
        right: (SOLID_R - FACE_CX) * sc + 22,
        top: (FACE_CY - SOLID_T) * sc + 40,
        bot: (SOLID_B - FACE_CY) * sc + 26
      };
    }

    function readSafe() {
      var cs = getComputedStyle(document.documentElement);
      function px(name) { return parseFloat(cs.getPropertyValue(name)) || 0; }
      safe.top = px('--sat');
      safe.bottom = px('--sab');
      safe.left = px('--sal');
      safe.right = px('--sar');
    }

    function playable() {
      var barH = 0;
      if (barEl && !hideUi) barH = barEl.getBoundingClientRect().height;
      var e = extents();
      var x0 = safe.left + 10 + e.left;
      var y0 = safe.top + 10 + e.top;
      var x1 = W - safe.right - 10 - e.right;
      var y1 = H - barH - 10 - e.bot;
      if (x1 - x0 < 40) { x0 = W * 0.28; x1 = W * 0.72; }
      if (y1 - y0 < 40) { y0 = H * 0.28; y1 = H * 0.62; }
      return { x0: x0, y0: y0, x1: x1, y1: y1 };
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      readSafe();
      S = clamp(Math.min(W, H) / 430, 0.72, 1.55);
      if (!pos.x && !pos.y) {
        var r = playable();
        pos.x = pos.tx = (r.x0 + r.x1) / 2;
        pos.y = pos.ty = (r.y0 + r.y1) / 2;
      }
    }

    function pickWanderTarget() {
      var r = playable();
      var x, y, tries = 0;
      do {
        x = rand(r.x0, r.x1);
        y = rand(r.y0, r.y1);
        tries++;
      } while (Math.hypot(x - pos.x, y - pos.y) < 80 * S && tries < 8);
      return { x: x, y: y };
    }

    function setExpressionInternal(name, fromAuto) {
      var resolved = resolveName(name);
      if (!resolved) return false;
      exprName = resolved;
      target = Object.assign(baseParams(), EXPR[resolved]);
      if (!fromAuto) {
        autoOn = false;
        autoBtn.setAttribute('aria-pressed', 'false');
      }
      syncPill();
      return true;
    }

    function holdRange(name) {
      var h = HOLD[name] || HOLD._default;
      return h;
    }

    function pickAutoExpression() {
      var pool = EXPRESSION_NAMES.filter(function (n) { return n !== exprName; });
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function setAuto(on) {
      autoOn = !!on;
      autoBtn.setAttribute('aria-pressed', autoOn ? 'true' : 'false');
      if (autoOn) {
        autoTimer = 0;
        autoHold = rand(holdRange(exprName)[0], holdRange(exprName)[1]);
      }
    }

    function syncPill() {
      var nodes = pillsEl.querySelectorAll('button[data-expr]');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].setAttribute('aria-pressed', nodes[i].getAttribute('data-expr') === exprName ? 'true' : 'false');
      }
    }

    function buildUI() {
      EXPRESSION_NAMES.forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'pill';
        b.textContent = LABELS[name];
        b.setAttribute('data-expr', name);
        b.addEventListener('click', function (e) {
          e.preventDefault();
          setExpressionInternal(name, false);
        });
        pillsEl.appendChild(b);
      });
      autoBtn.addEventListener('click', function (e) {
        e.preventDefault();
        setAuto(!autoOn);
      });
    }

    function startBlink(now, isSecond) {
      blinkState = 'closing';
      blinkUntil = now + 0.045;
      doublePending = !isSecond && Math.random() < 0.18;
    }

    function eyesAreOpenStyle() {
      // Don't blink fully closed eyes / X / flats as hard.
      return (cur.lCircle + cur.rCircle + cur.lCaret + cur.rCaret + cur.lSlit + cur.rSlit) > 0.4;
    }

    function updateBlink(dt, now) {
      if (blinkState === 'open') {
        if (now >= blinkUntil) {
          if (eyesAreOpenStyle() && now > pokeUntil) startBlink(now, false);
          else blinkUntil = now + rand(0.6, 2.2);
        }
        blink = expApproach(blink, 0, 28, dt);
      } else if (blinkState === 'closing') {
        blink = expApproach(blink, 1, 36, dt);
        if (now >= blinkUntil) {
          blinkState = 'opening';
          blinkUntil = now + 0.07;
        }
      } else if (blinkState === 'opening') {
        blink = expApproach(blink, 0, 28, dt);
        if (now >= blinkUntil && blink < 0.12) {
          if (doublePending) {
            doublePending = false;
            startBlink(now, true);
          } else {
            blinkState = 'open';
            blink = 0;
            blinkUntil = now + rand(1.8, 4.6);
          }
        }
      }
    }

    function updateLook(dt, now) {
      if (follow) {
        var dx = follow.x - pos.x;
        var dy = follow.y - pos.y;
        look.tx = clamp(dx / (140 * S), -1, 1);
        look.ty = clamp(dy / (140 * S), -1, 1);
      } else if (now >= look.until) {
        if (Math.random() < 0.22) {
          look.tx = 0;
          look.ty = 0;
        } else {
          look.tx = rand(-1, 1);
          look.ty = rand(-0.7, 0.7);
        }
        look.until = now + rand(1.2, 3.4);
      }
      if (phase === 'move' && !follow) {
        var sp = Math.hypot(pos.vx, pos.vy);
        if (sp > 20) {
          look.tx = clamp(look.tx * 0.7 + (pos.vx / 180) * 0.8, -1, 1);
          look.ty = clamp(look.ty * 0.7 + (pos.vy / 180) * 0.8, -1, 1);
        }
      }
      var ltx = clamp(look.tx + cur.lookBiasX, -1.15, 1.15);
      var lty = clamp(look.ty + cur.lookBiasY, -1.15, 1.15);
      look.x = expApproach(look.x, ltx, 6.5, dt);
      look.y = expApproach(look.y, lty, 6.5, dt);
    }

    function updateMotion(dt, now) {
      if (stillMode) {
        var r0 = playable();
        pos.tx = (r0.x0 + r0.x1) / 2;
        pos.ty = (r0.y0 + r0.y1) / 2;
      } else if (follow) {
        phase = 'follow';
        var bounds = playable();
        pos.tx = clamp(follow.x, bounds.x0, bounds.x1);
        pos.ty = clamp(follow.y, bounds.y0, bounds.y1);
      } else if (phase === 'pause') {
        pos.tx = pos.x;
        pos.ty = pos.y;
        if (now >= phaseUntil) {
          nextTarget = pickWanderTarget();
          var ang = Math.atan2(nextTarget.y - pos.y, nextTarget.x - pos.x);
          pos.tx = pos.x - Math.cos(ang) * 16 * S;
          pos.ty = pos.y - Math.sin(ang) * 16 * S;
          phase = 'anticipate';
          phaseUntil = now + 0.13;
          squash = 0.12;
        }
      } else if (phase === 'anticipate') {
        if (now >= phaseUntil) {
          pos.tx = nextTarget.x;
          pos.ty = nextTarget.y;
          phase = 'move';
        }
      } else if (phase === 'move' || phase === 'follow') {
        if (phase === 'move') {
          var dist = Math.hypot(pos.tx - pos.x, pos.ty - pos.y);
          var spd = Math.hypot(pos.vx, pos.vy);
          if (dist < 14 * S && spd < 28) {
            phase = 'pause';
            phaseUntil = now + rand(0.55, 2.1);
            pos.tx = pos.x;
            pos.ty = pos.y;
            squash = 0.1;
          }
        } else {
          phase = 'pause';
          phaseUntil = now + rand(0.4, 1.0);
        }
      }

      var omega = follow ? 7.2 : (phase === 'anticipate' ? 8.5 : 3.4);
      var zeta = follow ? 0.9 : 0.88;
      var ax = omega * omega * (pos.tx - pos.x) - 2 * zeta * omega * pos.vx;
      var ay = omega * omega * (pos.ty - pos.y) - 2 * zeta * omega * pos.vy;
      pos.vx += ax * dt;
      pos.vy += ay * dt;
      pos.x += pos.vx * dt;
      pos.y += pos.vy * dt;

      var b = playable();
      if (pos.x < b.x0) { pos.x = b.x0; if (pos.vx < 0) pos.vx *= -0.25; }
      if (pos.x > b.x1) { pos.x = b.x1; if (pos.vx > 0) pos.vx *= -0.25; }
      if (pos.y < b.y0) { pos.y = b.y0; if (pos.vy < 0) pos.vy *= -0.25; }
      if (pos.y > b.y1) { pos.y = b.y1; if (pos.vy > 0) pos.vy *= -0.25; }

      var speed = Math.hypot(pos.vx, pos.vy);
      var leanT = (speed > 8) ? Math.atan2(pos.vy, pos.vx) * clamp(speed / 260, 0, 0.18) : 0;
      lean = expApproach(lean, leanT, 5, dt);
      squash = expApproach(squash, 0, 8, dt);
    }

    function approachParams(dt) {
      var rate = 9;
      for (var k in target) {
        if (typeof cur[k] === 'number') cur[k] = expApproach(cur[k], target[k], rate, dt);
      }
    }

    function talkingNow() {
      return talkHeld || exprName === 'talking';
    }

    function updateAuto(dt) {
      if (!autoOn || stillMode) return;
      autoTimer += dt;
      if (autoTimer >= autoHold) {
        autoTimer = 0;
        var next = pickAutoExpression();
        setExpressionInternal(next, true);
        autoHold = rand(holdRange(next)[0], holdRange(next)[1]);
      }
    }

    function spriteToWorld(sx, sy, xf) {
      // xf: {x, y, scx, scy, ang} applied around FACE
      var dx = sx - FACE_CX;
      var dy = sy - FACE_CY;
      var ca = Math.cos(xf.ang), sa = Math.sin(xf.ang);
      var rx = dx * xf.scx;
      var ry = dy * xf.scy;
      return {
        x: xf.x + rx * ca - ry * sa,
        y: xf.y + rx * sa + ry * ca
      };
    }

    function currentXF() {
      var sc = bodyScale();
      var flickX = 1 + 0.012 * Math.sin(time * 17.2) + 0.008 * Math.sin(time * 29.0 + flickerN);
      var flickY = 1 + 0.018 * Math.sin(time * 13.6 + 0.7) + 0.01 * Math.sin(time * 23.4 + 1.4);
      var tipSway = 0.035 * Math.sin(time * 5.4) + 0.02 * Math.sin(time * 8.7 + 1.1);
      return {
        x: pos.x,
        y: pos.y,
        scx: sc * (1 + squash * 0.55) * flickX,
        scy: sc * (1 - squash * 0.4) * flickY,
        ang: lean + tipSway * 0.35
      };
    }

    function spawnEmber(now, xf) {
      var sx = rand(SOLID_L + 20, SOLID_R - 20);
      var sy = rand(TIP_Y + 30, FACE_CY + 20);
      var p = spriteToWorld(sx, sy, xf);
      embers.push({
        x: p.x, y: p.y,
        vx: rand(-12, 12) * S,
        vy: rand(-40, -18) * S,
        r: rand(1.1, 2.4) * S,
        born: now,
        life: rand(0.55, 1.15),
        hue: Math.random()
      });
    }

    function spawnDrop(now, xf) {
      var src = DRIPS[Math.random() < 0.45 ? 0 : 1];
      var p = spriteToWorld(src.x + rand(-3, 3), src.y + rand(-2, 4), xf);
      drops.push({
        x: p.x, y: p.y,
        vx: rand(-6, 6) * S,
        vy: rand(10, 24) * S,
        r: rand(1.6, 2.8) * S,
        born: now,
        life: rand(0.45, 0.85)
      });
    }

    function spawnSmoke(now, xf) {
      var p = spriteToWorld(TIP_X + rand(-18, 22), TIP_Y + rand(-6, 30), xf);
      smokes.push({
        x: p.x, y: p.y,
        vx: rand(-8, 14) * S,
        vy: rand(-22, -8) * S,
        r: rand(6, 13) * S,
        born: now,
        life: rand(0.9, 1.7)
      });
    }

    function updateParticles(dt, now, xf) {
      if (now >= nextEmber) {
        spawnEmber(now, xf);
        if (Math.random() < 0.4) spawnEmber(now, xf);
        nextEmber = now + rand(0.07, 0.18);
      }
      if (now >= nextDrop) {
        spawnDrop(now, xf);
        nextDrop = now + rand(0.55, 1.5);
      }
      if (now >= nextSmoke) {
        spawnSmoke(now, xf);
        nextSmoke = now + rand(0.28, 0.7);
      }
      var i;
      for (i = embers.length - 1; i >= 0; i--) {
        var e = embers[i];
        e.vy -= 18 * S * dt;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.vx *= (1 - 0.6 * dt);
        if (now - e.born > e.life) embers.splice(i, 1);
      }
      for (i = drops.length - 1; i >= 0; i--) {
        var d = drops[i];
        d.vy += 220 * S * dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        if (now - d.born > d.life) drops.splice(i, 1);
      }
      for (i = smokes.length - 1; i >= 0; i--) {
        var s = smokes[i];
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.r += 8 * S * dt;
        if (now - s.born > s.life) smokes.splice(i, 1);
      }
      while (embers.length > 36) embers.shift();
      while (drops.length > 6) drops.shift();
      while (smokes.length > 10) smokes.shift();
    }

    function makeGlow() {
      var c = document.createElement('canvas');
      var size = 384;
      c.width = c.height = size;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(size / 2, size * 0.52, size * 0.08, size / 2, size * 0.52, size * 0.5);
      grd.addColorStop(0, 'rgba(194,65,12,0.55)');
      grd.addColorStop(0.32, 'rgba(138,42,10,0.32)');
      grd.addColorStop(0.62, 'rgba(70,8,4,0.14)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      return c;
    }

    function makeSoftDot() {
      var c = document.createElement('canvas');
      var size = 96;
      c.width = c.height = size;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grd.addColorStop(0, 'rgba(255,252,246,0.95)');
      grd.addColorStop(0.35, 'rgba(255,248,230,0.40)');
      grd.addColorStop(1, 'rgba(255,248,230,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      return c;
    }

    function strokeRound(ctx, pts, thick) {
      if (pts.length < 2) return;
      ctx.lineWidth = thick;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    function eyeCenters() {
      var half = (GAP * EYE_D + EYE_D) / 2;
      return { lx: FACE_CX - half, rx: FACE_CX + half, y: FACE_CY };
    }

    function mouthCenterY(curve, width, thick) {
      var eyeBottom = FACE_CY + EYE_D / 2;
      var w = width * EYE_D;
      var t = thick * EYE_D;
      var R = Math.max(2, (w - t) / 2);
      if (curve >= 0) {
        return eyeBottom - R * Math.sin(20 * Math.PI / 180) * Math.max(curve, 0.0001) + t / 2;
      }
      return eyeBottom + R * Math.abs(curve) + t / 2;
    }

    function drawEyeStyle(c, cx, cy, D, kind, dir, rot, open, alpha) {
      if (alpha < 0.04) return;
      c.save();
      c.globalAlpha *= alpha;
      c.translate(cx, cy);
      c.rotate(rot || 0);
      var r = D / 2;
      var thick = D * 0.18;
      c.fillStyle = '#fff';
      c.strokeStyle = '#fff';
      c.lineCap = 'round';
      c.lineJoin = 'round';
      if (kind === 'circle') {
        var ry = r * Math.max(0.08, 1 - open);
        c.beginPath();
        c.ellipse(0, 0, r, ry, 0, 0, Math.PI * 2);
        c.fill();
      } else if (kind === 'happy') {
        // closed happy eye: upward arc
        var pts = [];
        var n = 10, rx = D * 0.46, ry = D * 0.28;
        for (var i = 0; i <= n; i++) {
          var t = i / n;
          var a = Math.PI + t * Math.PI;
          pts.push({ x: Math.cos(a) * rx, y: Math.sin(a) * ry + D * 0.08 });
        }
        strokeRound(c, pts, thick);
      } else if (kind === 'sad') {
        var pts2 = [];
        var n2 = 10, rx2 = D * 0.46, ry2 = D * 0.28;
        for (var j = 0; j <= n2; j++) {
          var t2 = j / n2;
          var a2 = t2 * Math.PI;
          pts2.push({ x: Math.cos(a2) * rx2, y: Math.sin(a2) * ry2 - D * 0.08 });
        }
        strokeRound(c, pts2, thick);
      } else if (kind === 'caret') {
        var h = D * 0.28, w = D * 0.42;
        strokeRound(c, [{ x: -w, y: h * 0.3 }, { x: 0, y: -h }, { x: w, y: h * 0.3 }], thick * 1.05);
      } else if (kind === 'chev') {
        var s = D * 0.38 * (dir || 1);
        strokeRound(c, [
          { x: -s * 0.15, y: -s * 0.85 },
          { x: s * 0.7, y: 0 },
          { x: -s * 0.15, y: s * 0.85 }
        ], thick * 1.05);
      } else if (kind === 'ex') {
        var k = D * 0.36;
        strokeRound(c, [{ x: -k, y: -k }, { x: k, y: k }], thick);
        strokeRound(c, [{ x: k, y: -k }, { x: -k, y: k }], thick);
      } else if (kind === 'flat') {
        strokeRound(c, [{ x: -D * 0.42, y: 0 }, { x: D * 0.42, y: 0 }], thick * 1.05);
      } else if (kind === 'slit') {
        var sl = D * 0.48;
        strokeRound(c, [{ x: -sl, y: 0 }, { x: sl, y: 0 }], thick * 0.95);
      }
      c.restore();
    }

    function drawBrows(c, lx, rx, y, D, amt) {
      if (amt < 0.05) return;
      c.save();
      c.globalAlpha *= amt;
      c.strokeStyle = '#fff';
      var thick = D * 0.11;
      // inner ends raised (worried)
      var lift = D * 0.16;
      var out = D * 0.22;
      var up = -D * 0.58;
      strokeRound(c, [
        { x: lx - out, y: y + up + lift * 0.2 },
        { x: lx + out * 0.9, y: y + up - lift }
      ], thick);
      strokeRound(c, [
        { x: rx + out, y: y + up + lift * 0.2 },
        { x: rx - out * 0.9, y: y + up - lift }
      ], thick);
      c.restore();
    }

    function drawMouth(c, p, tNow) {
      var width = p.mouthW * EYE_D;
      var thick = p.mouthThick * EYE_D;
      var curve = p.mouthCurve;
      var open = p.mouthOpen;
      if (talkingNow()) {
        var pulse = 0.38 + 0.62 * Math.abs(Math.sin(tNow * 10.5));
        open = Math.max(open, 0.55 * pulse + 0.15);
        curve = lerp(curve, 0.35, 0.7);
        width = lerp(width, 0.62 * EYE_D, 0.5);
      }
      var mx = FACE_CX;
      var my = mouthCenterY(curve, width / EYE_D, thick / EYE_D);

      c.strokeStyle = '#fff';
      c.fillStyle = '#fff';

      if (open > 0.08) {
        var rx = width * 0.42;
        var ry = EYE_D * (0.10 + 0.22 * open);
        var oy = FACE_CY + EYE_D / 2 + ry * 0.15 + thick * 0.2;
        c.lineWidth = Math.max(1.5, thick * 0.55);
        c.beginPath();
        c.ellipse(mx, oy, rx, ry, 0, 0, Math.PI * 2);
        c.stroke();
        return;
      }

      if (p.mouthWave > 0.08 && Math.abs(curve) < 0.85) {
        var pts = [];
        var n = 16;
        var half = width / 2;
        var amp = EYE_D * 0.14 * p.mouthWave;
        var y0 = FACE_CY + EYE_D / 2 + thick / 2;
        for (var i = 0; i <= n; i++) {
          var t = i / n;
          var x = mx - half + t * width;
          var y = y0 + Math.sin(t * Math.PI * 2) * amp;
          pts.push({ x: x, y: y });
        }
        strokeRound(c, pts, thick);
        return;
      }

      if (Math.abs(curve) < 0.12) {
        // flat unamused line, top at the eye line
        var yLine = FACE_CY + EYE_D / 2 + thick / 2;
        strokeRound(c, [
          { x: mx - width / 2, y: yLine },
          { x: mx + width / 2, y: yLine }
        ], thick);
        return;
      }

      var R = Math.max(2, (width - thick) / 2);
      var pts2 = [];
      var n2 = 18;
      var a0, a1, ry;
      if (curve > 0) {
        a0 = 20; a1 = 160;
        ry = R * Math.min(1, 0.55 + 0.45 * curve);
      } else {
        a0 = 200; a1 = 340;
        ry = R * Math.min(1, 0.55 + 0.45 * Math.abs(curve));
      }
      for (var j = 0; j <= n2; j++) {
        var u = j / n2;
        var a = (a0 + (a1 - a0) * u) * Math.PI / 180;
        pts2.push({ x: mx + Math.cos(a) * R, y: my + Math.sin(a) * ry });
      }
      strokeRound(c, pts2, thick);
    }

    function drawFace(c, tNow) {
      var eyes = eyeCenters();
      // Look: shift the whole face a little, staying inside the bulb.
      var maxLook = EYE_D * 0.28;
      var ox = look.x * maxLook;
      var oy = look.y * maxLook * 0.85;
      c.save();
      c.translate(ox, oy);

      var D = EYE_D;
      var open = blink;

      // Soft pre-rendered glow under features (no per-frame filters).
      if (softDot) {
        var gs = D * 2.6;
        c.globalAlpha = 0.55;
        c.drawImage(softDot, eyes.lx - gs / 2, eyes.y - gs / 2, gs, gs);
        c.drawImage(softDot, eyes.rx - gs / 2, eyes.y - gs / 2, gs, gs);
        var mg = D * 1.8;
        c.drawImage(softDot, FACE_CX - mg / 2, FACE_CY + D * 0.25 - mg / 2, mg, mg);
        c.globalAlpha = 1;
      }

      function pair(kind, lAmt, rAmt, lDir, rDir, lRot, rRot) {
        drawEyeStyle(c, eyes.lx, eyes.y, D, kind, lDir, lRot, open, lAmt);
        drawEyeStyle(c, eyes.rx, eyes.y, D, kind, rDir, rRot, open, rAmt);
      }

      pair('circle', cur.lCircle, cur.rCircle, 1, 1, 0, 0);
      pair('happy', cur.lHappy, cur.rHappy, 1, 1, 0, 0);
      pair('sad', cur.lSad, cur.rSad, 1, 1, 0, 0);
      pair('caret', cur.lCaret, cur.rCaret, 1, 1, 0, 0);
      pair('chev', cur.lChev, cur.rChev, cur.lChevDir, cur.rChevDir, 0, 0);
      pair('ex', cur.lEx, cur.rEx, 1, 1, 0, 0);
      pair('flat', cur.lFlat, cur.rFlat, 1, 1, 0, 0);
      pair('slit', cur.lSlit, cur.rSlit, 1, 1, cur.lSlitRot, cur.rSlitRot);
      drawBrows(c, eyes.lx, eyes.rx, eyes.y, D, cur.brow);
      drawMouth(c, cur, tNow);
      c.restore();
    }

    function drawLicks(c, tNow) {
      // Extra licking tongues at the painted tip. Cheap paths, no filters.
      c.save();
      c.globalCompositeOperation = 'source-over';
      var n = 3;
      for (var i = 0; i < n; i++) {
        var phase = tNow * (2.8 + i * 0.7) + i * 1.7;
        var len = 28 + 16 * (0.5 + 0.5 * Math.sin(phase));
        var bend = 18 * Math.sin(phase * 0.85 + i);
        var baseX = TIP_X + (i - 1) * 10 + 4 * Math.sin(phase * 0.6);
        var baseY = TIP_Y + 18 + i * 4;
        var midX = baseX + bend * 0.6 + 10;
        var midY = baseY - len * 0.55;
        var tipX = baseX + bend + 6 * Math.sin(phase * 1.3);
        var tipY = baseY - len;
        var w = 7 - i * 1.4;
        c.strokeStyle = i === 0 ? 'rgba(255,244,200,0.70)' : (i === 1 ? 'rgba(255,200,90,0.55)' : 'rgba(255,140,40,0.40)');
        c.lineWidth = w;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(baseX, baseY);
        c.quadraticCurveTo(midX, midY, tipX, tipY);
        c.stroke();
      }
      // tiny detached fleck, as in the reference
      var fleckA = 0.45 + 0.35 * Math.sin(tNow * 6.2);
      c.fillStyle = 'rgba(255,210,120,' + (0.55 * fleckA) + ')';
      var fx = TIP_X + 22 + 6 * Math.sin(tNow * 4.1);
      var fy = TIP_Y - 8 + 5 * Math.cos(tNow * 5.0);
      c.beginPath();
      c.ellipse(fx, fy, 2.6, 4.2, 0.4 + 0.2 * Math.sin(tNow * 3), 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function drawParticles(c, now) {
      var i, a, e, d, s;
      // faint smoke first
      for (i = 0; i < smokes.length; i++) {
        s = smokes[i];
        a = 1 - (now - s.born) / s.life;
        a = a * a * 0.10;
        if (a <= 0) continue;
        c.fillStyle = 'rgba(80,40,30,' + a + ')';
        c.beginPath();
        c.ellipse(s.x, s.y, s.r, s.r * 1.15, 0, 0, Math.PI * 2);
        c.fill();
      }
      for (i = 0; i < embers.length; i++) {
        e = embers[i];
        a = 1 - (now - e.born) / e.life;
        a = Math.max(0, a);
        var col = e.hue < 0.45 ? '255,230,160' : (e.hue < 0.8 ? '255,180,80' : '255,255,230');
        c.fillStyle = 'rgba(' + col + ',' + (0.85 * a) + ')';
        c.beginPath();
        c.arc(e.x, e.y, e.r * (0.7 + 0.3 * a), 0, Math.PI * 2);
        c.fill();
      }
      for (i = 0; i < drops.length; i++) {
        d = drops[i];
        a = 1 - (now - d.born) / d.life;
        a = Math.max(0, a);
        c.fillStyle = 'rgba(255,170,70,' + (0.9 * a) + ')';
        c.beginPath();
        c.ellipse(d.x, d.y, d.r * 0.7, d.r * 1.35, 0, 0, Math.PI * 2);
        c.fill();
      }
    }

    function drawEcho(now) {
      if (!ready || !bodyImg) return;
      var xf = currentXF();

      ctx.save();
      ctx.translate(xf.x, xf.y);
      ctx.rotate(xf.ang);
      ctx.scale(xf.scx, xf.scy);
      ctx.translate(-FACE_CX, -FACE_CY);

      // Pulsing pre-rendered glow under the body (no filter).
      if (glowCvs) {
        var pulse = 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(now * 2.15));
        var gw = (SOLID_W + 260);
        var gh = gw;
        ctx.globalAlpha = pulse;
        ctx.drawImage(glowCvs, BULB_CX - gw / 2, BULB_CY - gh * 0.46, gw, gh);
        ctx.globalAlpha = 1;
      }

      ctx.drawImage(bodyImg, 0, 0, IMG_W, IMG_H);
      drawLicks(ctx, now);
      drawFace(ctx, now);
      ctx.restore();

      drawParticles(ctx, now);
    }

    function update(dt, now) {
      updateBlink(dt, now);
      updateLook(dt, now);
      updateMotion(dt, now);
      approachParams(dt);
      updateAuto(dt);
      if (pokeUntil && now >= pokeUntil) pokeUntil = 0;
      var xf = currentXF();
      updateParticles(dt, now, xf);
    }

    function draw(now) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      drawEcho(now);
      if (debugOn) {
        fpsAcc += 1;
        if (now - (fpsFrames || now) >= 0.5) {
          fpsVal = Math.round(fpsAcc / Math.max(0.001, now - fpsFrames));
          fpsFrames = now;
          fpsAcc = 0;
          fpsEl.textContent = fpsVal + ' fps';
        }
        if (!fpsFrames) fpsFrames = now;
      }
    }

    function loop(ts) {
      var now = ts * 0.001;
      var dt = last ? Math.min(0.05, now - last) : 0.016;
      last = now;
      time = now;
      update(dt, now);
      draw(now);
      requestAnimationFrame(loop);
    }

    function clientPoint(ev) {
      var x, y;
      if (ev.touches && ev.touches[0]) {
        x = ev.touches[0].clientX;
        y = ev.touches[0].clientY;
      } else {
        x = ev.clientX;
        y = ev.clientY;
      }
      return { x: x, y: y };
    }

    var pointerDown = false;
    var pointerId = null;
    var downAt = 0;
    var downPt = { x: 0, y: 0 };
    var moved = false;

    function hitRadius() {
      return extents().left * 1.05;
    }

    function onDown(ev) {
      if (ev.target && ev.target.closest && ev.target.closest('#bar')) return;
      var p = clientPoint(ev);
      pointerDown = true;
      moved = false;
      downAt = time;
      downPt = p;
      if (ev.pointerId != null) {
        pointerId = ev.pointerId;
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
      }
      var dist = Math.hypot(p.x - pos.x, p.y - pos.y);
      if (dist < hitRadius() * 1.15) {
        pokeUntil = time + 0.85;
        var ang = Math.atan2(pos.y - p.y, pos.x - p.x);
        pos.vx += Math.cos(ang) * 220 * S;
        pos.vy += Math.sin(ang) * 220 * S;
        squash = 0.18;
        look.tx = clamp((p.x - pos.x) / (80 * S), -1, 1);
        look.ty = clamp((p.y - pos.y) / (80 * S), -1, 1);
        look.until = time + 1.4;
      } else {
        look.tx = clamp((p.x - pos.x) / (140 * S), -1, 1);
        look.ty = clamp((p.y - pos.y) / (140 * S), -1, 1);
        look.until = time + 2.2;
        if (!stillMode) {
          var b = playable();
          pos.tx = clamp(p.x, b.x0, b.x1);
          pos.ty = clamp(p.y, b.y0, b.y1);
          follow = { x: pos.tx, y: pos.ty };
        }
      }
    }

    function onMove(ev) {
      if (!pointerDown) return;
      var p = clientPoint(ev);
      if (Math.hypot(p.x - downPt.x, p.y - downPt.y) > 8) moved = true;
      if (follow && !stillMode) {
        var b = playable();
        follow.x = clamp(p.x, b.x0, b.x1);
        follow.y = clamp(p.y, b.y0, b.y1);
      }
    }

    function onUp(ev) {
      if (!pointerDown) return;
      pointerDown = false;
      pointerId = null;
      if (follow) {
        pos.tx = follow.x;
        pos.ty = follow.y;
        nextTarget = { x: follow.x, y: follow.y };
        phase = 'move';
      }
      follow = null;
    }

    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    window.addEventListener('blur', onUp);

    document.addEventListener('touchmove', function (e) {
      if (e.target && e.target.closest && e.target.closest('#pills')) return;
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 80); });

    window.echoFace = {
      setExpression: function (name) { return setExpressionInternal(name, false); },
      talk: function (on) { talkHeld = !!on; },
      setAuto: function (on) { setAuto(on); },
      getExpression: function () { return exprName; },
      expressions: EXPRESSION_NAMES.slice()
    };

    buildUI();
    resize();
    setExpressionInternal(startName, true);
    if (autoOn) setAuto(true);
    blinkUntil = rand(0.8, 2.0);

    var img = new Image();
    img.onload = function () {
      bodyImg = img;
      glowCvs = makeGlow();
      softDot = makeSoftDot();
      ready = true;
      flickerN = Math.random() * 10;
      nextEmber = 0.1;
      nextDrop = 0.4;
      nextSmoke = 0.2;
      requestAnimationFrame(function (ts) {
        last = ts * 0.001;
        requestAnimationFrame(loop);
      });
    };
    img.onerror = function () {
      // Still run, procedurally, so the page is never blank if the asset 404s.
      glowCvs = makeGlow();
      softDot = makeSoftDot();
      ready = true;
      requestAnimationFrame(function (ts) {
        last = ts * 0.001;
        requestAnimationFrame(loop);
      });
    };
    img.src = 'assets/flame-body.png';
  })();
  </script>
</body>
</html>
