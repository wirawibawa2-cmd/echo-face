<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Echo">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Echo flame preview — a centered fire spirit.">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
  <title>Echo</title>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      color: #fff;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #flame { z-index: 0; background: #000; }
    #c { z-index: 1; background: transparent; }
    #bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 10px calc(8px + var(--sab));
      padding-left: max(10px, var(--sal));
      padding-right: max(10px, var(--sar));
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 2;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 40%, rgba(0,0,0,0));
      pointer-events: none;
    }
    #bar > * { pointer-events: auto; }
    body.hide-ui #bar { display: none; }
    #autoBtn { flex: 0 0 auto; }
    #pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 18px), transparent);
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 18px), transparent);
    }
    #pills::-webkit-scrollbar { display: none; }
    button.pill {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.84);
      border-radius: 999px;
      padding: 7px 11px;
      font: 600 12px/1.15 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      letter-spacing: 0.01em;
      white-space: nowrap;
      margin: 0;
      cursor: pointer;
    }
    button.pill:active { transform: scale(0.97); }
    button.pill[aria-pressed="true"] {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.28);
      color: #fff;
    }
    #autoBtn[aria-pressed="true"] { background: rgba(255,255,255,0.28); }
    #fps {
      display: none;
      position: fixed;
      top: calc(6px + var(--sat));
      right: max(8px, var(--sar));
      font: 500 11px/1.2 ui-monospace, Menlo, monospace;
      color: rgba(255,255,255,0.4);
      z-index: 2;
      pointer-events: none;
    }
    body.debug #fps { display: block; }
  </style>
</head>
<body>
  <canvas id="flame" aria-hidden="true"></canvas>
  <canvas id="c" aria-label="Echo"></canvas>
  <div id="bar">
    <button type="button" class="pill" id="autoBtn" aria-pressed="false">Auto</button>
    <div id="pills" role="toolbar" aria-label="Expressions"></div>
  </div>
  <div id="fps"></div>
  <script>
  (function () {
    'use strict';

    // Sprite landmarks, in flame-body.png pixels (cropped lively-white-v5, no face).
    var IMG_W = 720, IMG_H = 939;
    var FACE_CX = 358.0, FACE_CY = 510.9, EYE_D = 35.4, GAP = 1.20;
    var SOLID_L = 255, SOLID_R = 459, SOLID_T = 253, SOLID_B = 687;
    var BULB_CX = 358.0, BULB_CY = 500.1;
    var TIP_X = 361, TIP_Y = 253;
    var DRIPS = [{ x: 345, y: 632 }, { x: 368, y: 685 }];
    var MOUTH_FRAC = 0.70, MOUTH_THICK = 0.22;
    var SOLID_W = SOLID_R - SOLID_L;

    var EXPRESSION_NAMES = [
      'happy', 'sad', 'veryHappy', 'wavy', 'content', 'disappointed',
      'angry', 'dizzy', 'squint', 'wink', 'unamused', 'worried'
    ];

    var LABELS = {
      happy: 'Happy', sad: 'Sad', veryHappy: 'Very happy', wavy: 'Wavy',
      content: 'Content', disappointed: 'Disappointed', angry: 'Angry',
      dizzy: 'Dizzy', squint: 'Squint', wink: 'Wink',
      unamused: 'Unamused', worried: 'Worried',
      neutral: 'Neutral', talking: 'Talking'
    };

    var ALIASES = {
      'very-happy': 'veryHappy', veryhappy: 'veryHappy', 'very happy': 'veryHappy',
      smile: 'happy', frown: 'sad',
      default: 'neutral', idle: 'neutral',
      talk: 'talking',
      mad: 'angry', wow: 'veryHappy',
      bored: 'unamused', deadpan: 'unamused',
      nervous: 'worried', concern: 'worried'
    };

    // Eye kinds: circle, happyArc, sadArc, caret, chevron, ex, flat, slit
    function baseParams() {
      return {
        lCircle: 1, rCircle: 1,
        lHappy: 0, rHappy: 0,
        lSad: 0, rSad: 0,
        lCaret: 0, rCaret: 0,
        lChev: 0, rChev: 0, lChevDir: 1, rChevDir: -1,
        lEx: 0, rEx: 0,
        lFlat: 0, rFlat: 0,
        lSlit: 0, rSlit: 0, lSlitRot: 0.45, rSlitRot: -0.45,
        brow: 0,
        mouthCurve: 1,
        mouthW: MOUTH_FRAC,
        mouthThick: MOUTH_THICK,
        mouthWave: 0,
        mouthOpen: 0,
        lookBiasX: 0, lookBiasY: 0
      };
    }

    function pCircle(extra) {
      return Object.assign(baseParams(), extra || {});
    }

    var EXPR = {};
    EXPR.happy = pCircle({ mouthCurve: 1, mouthW: 0.70 });
    EXPR.neutral = pCircle({ mouthCurve: 0.45, mouthW: 0.55, mouthThick: 0.20 });
    EXPR.sad = pCircle({ mouthCurve: -1, mouthW: 0.70, lookBiasY: 0.22 });
    EXPR.veryHappy = pCircle({
      lCircle: 0, rCircle: 0, lCaret: 1, rCaret: 1,
      mouthCurve: 1, mouthW: 0.75
    });
    EXPR.wavy = pCircle({ mouthCurve: 0.25, mouthW: 0.80, mouthWave: 1 });
    EXPR.content = pCircle({
      lCircle: 0, rCircle: 0, lHappy: 1, rHappy: 1,
      mouthCurve: 1, mouthW: 0.75
    });
    EXPR.disappointed = pCircle({
      lCircle: 0, rCircle: 0, lSad: 1, rSad: 1,
      mouthCurve: -1, mouthW: 0.70, lookBiasY: 0.2
    });
    EXPR.angry = pCircle({
      lCircle: 0, rCircle: 0, lSlit: 1, rSlit: 1,
      mouthCurve: -1, mouthW: 0.65, brow: 0.35
    });
    EXPR.dizzy = pCircle({
      lCircle: 0, rCircle: 0, lEx: 1, rEx: 1,
      mouthCurve: -0.85, mouthW: 0.62
    });
    EXPR.squint = pCircle({
      lCircle: 0, rCircle: 0, lChev: 1, rChev: 1,
      lChevDir: 1, rChevDir: -1,
      mouthCurve: 1, mouthW: 0.70
    });
    EXPR.wink = pCircle({
      lCircle: 0, rCircle: 1, lChev: 1, rChev: 0,
      lChevDir: 1,
      mouthCurve: 1, mouthW: 0.70
    });
    EXPR.unamused = pCircle({
      lCircle: 0, rCircle: 0, lFlat: 1, rFlat: 1,
      mouthCurve: 0, mouthW: 0.72, mouthThick: 0.20
    });
    EXPR.worried = pCircle({
      mouthCurve: -1, mouthW: 0.70, brow: 1, lookBiasY: 0.12
    });
    EXPR.talking = pCircle({
      mouthCurve: 0.35, mouthW: 0.62, mouthOpen: 0.7, mouthThick: 0.20
    });

    var HOLD = {
      wink: [1.15, 1.7],
      dizzy: [1.6, 2.4],
      talking: [2.4, 3.6],
      _default: [2.6, 4.4]
    };

    function resolveName(name) {
      if (name == null) return null;
      var key = String(name).trim();
      if (EXPR[key]) return key;
      var lower = key.toLowerCase();
      if (EXPR[lower]) return lower;
      if (ALIASES[lower]) return ALIASES[lower];
      if (ALIASES[key]) return ALIASES[key];
      return null;
    }

    var q = new URLSearchParams(location.search);
    function flag(k) {
      if (!q.has(k)) return false;
      var v = q.get(k);
      return v !== '0' && v !== 'false' && v !== 'no';
    }

    var startName = resolveName(q.get('expr')) || 'happy';
    var autoOn = flag('auto');
    var stillMode = flag('still');
    var debugOn = flag('debug');
    var hideUi = flag('hideui') || flag('demo') || q.get('ui') === '0';

    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
    var fpsEl = document.getElementById('fps');
    var barEl = document.getElementById('bar');
    var pillsEl = document.getElementById('pills');
    var autoBtn = document.getElementById('autoBtn');

    if (debugOn) document.body.classList.add('debug');
    if (hideUi) document.body.classList.add('hide-ui');

    var dpr = 1;
    var W = 1, H = 1, S = 1;
    var safe = { top: 0, bottom: 0, left: 0, right: 0 };

    var cur = baseParams();
    var target = Object.assign(baseParams(), EXPR[startName]);
    var exprName = startName;
    var talkHeld = false;
    var autoTimer = 0;
    var autoHold = 3;

    var pos = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0 };
    var nextTarget = { x: 0, y: 0 };
    var phase = stillMode ? 'still' : 'pause';
    var phaseUntil = 0;
    var lean = 0;
    var squash = 0;

    var look = { x: 0, y: 0, tx: 0, ty: 0, until: 0 };
    var blink = 0;
    var blinkUntil = 0;
    var blinkState = 'open';
    var doublePending = false;

    var follow = null;
    var pokeUntil = 0;

    var embers = [];
    var drops = [];
    var smokes = [];
    var tongues = [];
    var bits = [];
    var nextEmber = 0;
    var nextDrop = 0;
    var nextSmoke = 0;
    var nextTongue = 0;
    var outline = null;
    var rest = { x: 0, y: 0 };
    var flare = 0;
    var NECK_Y = 402;

    var time = 0;
    var last = 0;
    var fpsAcc = 0, fpsFrames = 0, fpsVal = 60;

    var bodyImg = null;
    var glowCvs = null;
    var softDot = null;
    var ready = false;
    var flickerN = 0;

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function rand(a, b) { return a + Math.random() * (b - a); }
    function expApproach(curV, tgt, rate, dt) {
      return curV + (tgt - curV) * (1 - Math.exp(-rate * dt));
    }

    function bodyScale() {
      return (124 * S) / SOLID_W;
    }

    function extents() {
      var sc = bodyScale();
      return {
        left: (FACE_CX - SOLID_L) * sc + 22,
        right: (SOLID_R - FACE_CX) * sc + 22,
        top: (FACE_CY - SOLID_T) * sc + 40,
        bot: (SOLID_B - FACE_CY) * sc + 26
      };
    }

    function readSafe() {
      var cs = getComputedStyle(document.documentElement);
      function px(name) { return parseFloat(cs.getPropertyValue(name)) || 0; }
      safe.top = px('--sat');
      safe.bottom = px('--sab');
      safe.left = px('--sal');
      safe.right = px('--sar');
    }

    function playable() {
      var barH = 0;
      if (barEl && !hideUi) barH = barEl.getBoundingClientRect().height;
      var e = extents();
      var x0 = safe.left + 10 + e.left;
      var y0 = safe.top + 10 + e.top;
      var x1 = W - safe.right - 10 - e.right;
      var y1 = H - barH - 10 - e.bot;
      if (x1 - x0 < 40) { x0 = W * 0.28; x1 = W * 0.72; }
      if (y1 - y0 < 40) { y0 = H * 0.28; y1 = H * 0.62; }
      return { x0: x0, y0: y0, x1: x1, y1: y1 };
    }


    // --- WebGL1 procedural fire (raw, no libraries). Fallback is the canvas flame. ---
    var flameCanvas = document.getElementById('flame');
    var glOk = false;
    var gl = null;
    var glProg = null;
    var glBuf = null;
    var glUni = {};
    var lastDraw = 0;

    var FLAME_VERT = 'attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.0,1.0);}';

    var FLAME_FRAG = [
      '#ifdef GL_FRAGMENT_PRECISION_HIGH',
      'precision highp float;',
      '#else',
      'precision mediump float;',
      '#endif',
      'uniform vec2 uRes;',
      'uniform vec2 uCenter;',
      'uniform vec2 uScale;',
      'uniform float uAngle;',
      'uniform float uTime;',
      'uniform float uFlare;',
      '',
      'float hash12(vec2 p){',
      '  vec2 q = fract(p * vec2(0.1031, 0.1030));',
      '  q += dot(q, q.yx + 33.33);',
      '  return fract((q.x + q.y) * q.x);',
      '}',
      '',
      'float vnoise(vec2 p){',
      '  vec2 i = floor(p);',
      '  vec2 f = fract(p);',
      '  vec2 u = f * f * (3.0 - 2.0 * f);',
      '  float a = hash12(i);',
      '  float b = hash12(i + vec2(1.0, 0.0));',
      '  float c = hash12(i + vec2(0.0, 1.0));',
      '  float d = hash12(i + vec2(1.0, 1.0));',
      '  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);',
      '}',
      '',
      'float fbm(vec2 p){',
      '  float v = 0.0;',
      '  float a = 0.5;',
      '  for (int i = 0; i < 4; i++) {',
      '    v += a * vnoise(p);',
      '    p = vec2(p.x * 1.62 + p.y * 1.22, -p.x * 1.22 + p.y * 1.62) + 11.5;',
      '    a *= 0.5;',
      '  }',
      '  return v;',
      '}',
      '',
      // p in bulb-radii, y up, face at origin. Returns signed distance (neg = inside).
      'float sdCapsule(vec2 p, vec2 a, vec2 b, float r){',
      '  vec2 pa = p - a, ba = b - a;',
      '  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);',
      '  return length(pa - ba * h) - r;',
      '}',
      '',
      'float sdFlame(vec2 p, float t){',
      '  float h = smoothstep(0.30, 2.35, p.y);',
      '  float w1 = fbm(vec2(t * 2.45, 1.6));',
      '  float w2 = fbm(vec2(t * 3.95 + 4.0, 2.8));',
      '  vec2 q = p;',
      '  q.x += (w1 * 2.0 - 1.0) * 0.68 * h * h;',
      '  q.y += (w2 * 2.0 - 1.0) * 0.22 * h;',
      '  float ang = (fbm(vec2(t * 2.85, 5.2)) - 0.5) * 1.15 * h * h;',
      '  float ca = cos(ang), sa = sin(ang);',
      '  vec2 o = vec2(0.0, 0.95);',
      '  vec2 tq = q - o;',
      '  q = vec2(ca * tq.x - sa * tq.y, sa * tq.x + ca * tq.y) + o;',
      '  // Extra hook so the tip curls back like the reference tongue.',
      '  float hook = smoothstep(1.45, 2.35, q.y);',
      '  float hookA = (fbm(vec2(t * 3.35, 8.1)) - 0.5) * 1.55;',
      '  q.x += hookA * hook * hook * 0.70;',
      '  q.y -= abs(hookA) * hook * hook * 0.22;',
      '  float bulb = length(q - vec2(0.0, 0.10)) - 1.0;',
      '  float u = clamp((q.y + 0.05) / 2.55, 0.0, 1.0);',
      '  float halfW = mix(1.00, 0.055, pow(u, 0.80));',
      '  float sides = abs(q.x) / max(halfW, 0.03) - 1.0;',
      '  float sd = mix(bulb, sides, smoothstep(-0.05, 1.15, q.y));',
      '  sd = max(sd, q.y - 2.62);',
      '  // Two or three organic hanging drips that stretch and shrink — never a comb.',
      '  float y0 = -0.78;',
      '  float p1 = pow(0.5 + 0.5 * sin(t * 1.25 + 0.2), 1.6);',
      '  float p2 = pow(0.5 + 0.5 * sin(t * 0.95 + 2.4), 1.8);',
      '  float p3 = pow(0.5 + 0.5 * sin(t * 1.55 + 4.1), 2.2);',
      '  float l1 = 0.14 + 0.48 * p1;',
      '  float l2 = 0.22 + 0.82 * p2;',
      '  float l3 = 0.10 + 0.32 * p3;',
      '  float x1 = -0.28 + 0.05 * sin(t * 0.62);',
      '  float x2 =  0.05 + 0.04 * sin(t * 0.51 + 1.0);',
      '  float x3 =  0.32 + 0.05 * sin(t * 0.73 + 2.0);',
      '  float d1 = sdCapsule(q, vec2(x1, y0), vec2(x1 * 1.08, y0 - l1), mix(0.12, 0.045, p1));',
      '  float d2 = sdCapsule(q, vec2(x2, y0), vec2(x2 * 0.90, y0 - l2), mix(0.13, 0.040, p2));',
      '  float d3 = sdCapsule(q, vec2(x3, y0), vec2(x3 * 1.06, y0 - l3), mix(0.10, 0.040, p3));',
      '  sd = min(sd, min(d1, min(d2, d3)));',
      '  return sd;',
      '}',
      '',
      'void main(){',
      '  vec2 screen = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);',
      '  vec2 d = screen - uCenter;',
      '  float ca = cos(uAngle), sa = sin(uAngle);',
      '  vec2 r = vec2(ca * d.x + sa * d.y, -sa * d.x + ca * d.y);',
      '  vec2 p = vec2(r.x / max(uScale.x, 0.001), -r.y / max(uScale.y, 0.001));',
      '  p /= 102.0;',
      '  float t = uTime;',
      '  float flare = uFlare;',
      '',
      '  vec2 ns = vec2(p.x * 2.15, p.y * 1.9 - t * 2.75);',
      '  float hw = smoothstep(0.25, 2.3, p.y);',
      '  vec2 war1 = vec2(fbm(ns + vec2(0.0, t * 0.32)), fbm(ns + vec2(5.1, -t * 0.28)));',
      '  ns += (war1 - 0.5) * (0.42 + 0.28 * flare + 0.40 * hw * hw);',
      '  vec2 war2 = vec2(fbm(ns * 2.15 + 9.0 + t * 0.12), fbm(ns * 2.15 + 17.0 - t * 0.1));',
      '  ns += (war2 - 0.5) * (0.18 + 0.28 * hw);',
      '  float n = fbm(ns * 1.85);',
      '  float nFine = fbm(ns * 3.7 + vec2(8.0, t * 0.45));',
      '',
      '  float sd = sdFlame(p, t);',
      '  // Keep the bulb steadier; spend the turbulence on the crown and tongues.',
      '  sd -= (n - 0.48) * (0.07 + 0.58 * hw * hw + 0.14 * flare);',
      '  sd -= (nFine - 0.5) * (0.05 + 0.16 * hw);',
      '',
      '  float fire = smoothstep(0.10, -0.02, sd);',
      '  float fireSoft = smoothstep(0.22, -0.04, sd);',
      '',
      '  // Approved dark ember behind the face.',
      '  float core = 1.0 - smoothstep(0.10, 0.78, length(p - vec2(0.0, 0.04)));',
      '  core *= 1.0 - smoothstep(0.45, 1.25, p.y);',
      '',
      '  // Tight incandescent rim — hot white-yellow, not a grey ash crust.',
      '  float rim = fire * exp(-12.0 * abs(sd + 0.01));',
      '  rim = clamp(rim * 1.35, 0.0, 1.0);',
      '  float tip = smoothstep(0.70, 1.90, p.y) * fire;',
      '',
      '  vec3 emberA = vec3(0.42, 0.11, 0.025);',
      '  vec3 emberB = vec3(0.761, 0.255, 0.047);',
      '  vec3 orange = vec3(1.00, 0.38, 0.04);',
      '  vec3 yellow = vec3(1.00, 0.92, 0.32);',
      '  vec3 hot = vec3(1.00, 0.98, 0.90);',
      '',
      '  vec3 col = mix(emberB, orange, clamp(0.25 + 0.75 * n, 0.0, 1.0));',
      '  col = mix(col, emberA, core);',
      '  col = mix(col, yellow, clamp(rim * 0.95 + tip * 0.65, 0.0, 1.0));',
      '  col = mix(col, hot, clamp(pow(rim, 0.75) * (0.85 + 0.6 * tip) + tip * 0.25, 0.0, 1.0));',
      '  col *= 0.92 + 0.10 * nFine + 0.12 * flare;',
      '',
      '  // Small detached sparks near the tip only.',
      '  vec2 bp = vec2(p.x * 4.4, p.y * 4.2 - t * 3.4);',
      '  float bits = smoothstep(0.74, 0.90, fbm(bp + 13.5));',
      '  bits *= smoothstep(1.35, 1.95, p.y) * smoothstep(2.75, 2.15, p.y);',
      '  bits *= (1.0 - fire * 0.65) * smoothstep(0.85, 0.15, abs(p.x));',
      '  col = mix(col, hot, bits);',
      '  fire = max(fire, bits);',
      '',
      '  // Soft dark-red glow, faint thin ring.',
      '  float glow = exp(-max(sd, 0.0) * 3.1) * (0.48 + 0.16 * fbm(vec2(t * 1.55, 0.4)) + 0.16 * flare);',
      '  glow *= 1.0 - fire * 0.3;',
      '  vec3 glowCol = vec3(0.55, 0.06, 0.012);',
      '  float ring = abs(length(p - vec2(0.0, 0.10)) - 1.70);',
      '  float ringA = exp(-ring * ring * 220.0) * (0.14 + 0.06 * fbm(vec2(p.x * 2.5, t * 0.35)));',
      '  vec3 ringCol = vec3(0.80, 0.20, 0.04);',
      '',
      '  vec3 rgb = glowCol * glow + ringCol * ringA;',
      '  rgb = mix(rgb, col, fire);',
      '  rgb += hot * bits * 0.8;',
      '  gl_FragColor = vec4(rgb, 1.0);',
      '}'
    ].join('\n');

    function compileShader(type, src) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.warn('Echo flame shader', gl.getShaderInfoLog(sh));
        gl.deleteShader(sh);
        return null;
      }
      return sh;
    }

    function initFlameGL() {
      if (!flameCanvas) return false;
      var opts = {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        premultipliedAlpha: true,
        preserveDrawingBuffer: false,
        powerPreference: 'high-performance'
      };
      gl = flameCanvas.getContext('webgl', opts) || flameCanvas.getContext('experimental-webgl', opts);
      if (!gl) return false;
      var vs = compileShader(gl.VERTEX_SHADER, FLAME_VERT);
      var fs = compileShader(gl.FRAGMENT_SHADER, FLAME_FRAG);
      if (!vs || !fs) return false;
      glProg = gl.createProgram();
      gl.attachShader(glProg, vs);
      gl.attachShader(glProg, fs);
      gl.bindAttribLocation(glProg, 0, 'aPos');
      gl.linkProgram(glProg);
      if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) {
        console.warn('Echo flame program', gl.getProgramInfoLog(glProg));
        return false;
      }
      glBuf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, glBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
        -1, -1, 1, -1, -1, 1, 1, 1
      ]), gl.STATIC_DRAW);
      glUni.uRes = gl.getUniformLocation(glProg, 'uRes');
      glUni.uCenter = gl.getUniformLocation(glProg, 'uCenter');
      glUni.uScale = gl.getUniformLocation(glProg, 'uScale');
      glUni.uAngle = gl.getUniformLocation(glProg, 'uAngle');
      glUni.uTime = gl.getUniformLocation(glProg, 'uTime');
      glUni.uFlare = gl.getUniformLocation(glProg, 'uFlare');
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);
      return true;
    }

    function resizeFlameGL() {
      if (!gl || !flameCanvas) return;
      var dw = Math.max(1, Math.round(W));
      var dh = Math.max(1, Math.round(H));
      if (flameCanvas.width !== dw || flameCanvas.height !== dh) {
        flameCanvas.width = dw;
        flameCanvas.height = dh;
      }
      flameCanvas.style.width = W + 'px';
      flameCanvas.style.height = H + 'px';
      gl.viewport(0, 0, dw, dh);
    }

    function renderFlameGL(now, xf) {
      if (!gl || !glProg) return;
      gl.viewport(0, 0, flameCanvas.width, flameCanvas.height);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(glProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, glBuf);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.uniform2f(glUni.uRes, flameCanvas.width, flameCanvas.height);
      gl.uniform2f(glUni.uCenter, xf.x, xf.y);
      gl.uniform2f(glUni.uScale, xf.scx, xf.scy);
      gl.uniform1f(glUni.uAngle, xf.ang);
      gl.uniform1f(glUni.uTime, now);
      gl.uniform1f(glUni.uFlare, flare);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      readSafe();
      S = clamp(Math.min(W, H) / 430, 0.72, 1.55);
      placeCenter(true);
      if (glOk) resizeFlameGL();
    }

    function placeCenter(init) {
      var barH = (barEl && !hideUi) ? barEl.getBoundingClientRect().height : 0;
      rest.x = W / 2;
      rest.y = safe.top + (H - safe.top - barH) / 2;
      if (init || (!pos.x && !pos.y)) {
        pos.x = pos.tx = rest.x;
        pos.y = pos.ty = rest.y;
        pos.vx = 0;
        pos.vy = 0;
      }
    }

    function pickWanderTarget() {
      var r = playable();
      var x, y, tries = 0;
      do {
        x = rand(r.x0, r.x1);
        y = rand(r.y0, r.y1);
        tries++;
      } while (Math.hypot(x - pos.x, y - pos.y) < 80 * S && tries < 8);
      return { x: x, y: y };
    }

    function setExpressionInternal(name, fromAuto) {
      var resolved = resolveName(name);
      if (!resolved) return false;
      exprName = resolved;
      target = Object.assign(baseParams(), EXPR[resolved]);
      if (!fromAuto) {
        autoOn = false;
        autoBtn.setAttribute('aria-pressed', 'false');
      }
      syncPill();
      return true;
    }

    function holdRange(name) {
      var h = HOLD[name] || HOLD._default;
      return h;
    }

    function pickAutoExpression() {
      var pool = EXPRESSION_NAMES.filter(function (n) { return n !== exprName; });
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function setAuto(on) {
      autoOn = !!on;
      autoBtn.setAttribute('aria-pressed', autoOn ? 'true' : 'false');
      if (autoOn) {
        autoTimer = 0;
        autoHold = rand(holdRange(exprName)[0], holdRange(exprName)[1]);
      }
    }

    function syncPill() {
      var nodes = pillsEl.querySelectorAll('button[data-expr]');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].setAttribute('aria-pressed', nodes[i].getAttribute('data-expr') === exprName ? 'true' : 'false');
      }
    }

    function buildUI() {
      EXPRESSION_NAMES.forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'pill';
        b.textContent = LABELS[name];
        b.setAttribute('data-expr', name);
        b.addEventListener('click', function (e) {
          e.preventDefault();
          setExpressionInternal(name, false);
        });
        pillsEl.appendChild(b);
      });
      autoBtn.addEventListener('click', function (e) {
        e.preventDefault();
        setAuto(!autoOn);
      });
    }

    function startBlink(now, isSecond) {
      blinkState = 'closing';
      blinkUntil = now + 0.045;
      doublePending = !isSecond && Math.random() < 0.18;
    }

    function eyesAreOpenStyle() {
      // Don't blink fully closed eyes / X / flats as hard.
      return (cur.lCircle + cur.rCircle + cur.lCaret + cur.rCaret + cur.lSlit + cur.rSlit) > 0.4;
    }

    function updateBlink(dt, now) {
      if (blinkState === 'open') {
        if (now >= blinkUntil) {
          if (eyesAreOpenStyle() && now > pokeUntil) startBlink(now, false);
          else blinkUntil = now + rand(0.6, 2.2);
        }
        blink = expApproach(blink, 0, 28, dt);
      } else if (blinkState === 'closing') {
        blink = expApproach(blink, 1, 36, dt);
        if (now >= blinkUntil) {
          blinkState = 'opening';
          blinkUntil = now + 0.07;
        }
      } else if (blinkState === 'opening') {
        blink = expApproach(blink, 0, 28, dt);
        if (now >= blinkUntil && blink < 0.12) {
          if (doublePending) {
            doublePending = false;
            startBlink(now, true);
          } else {
            blinkState = 'open';
            blink = 0;
            blinkUntil = now + rand(1.8, 4.6);
          }
        }
      }
    }

    function updateLook(dt, now) {
      if (follow) {
        var dx = follow.x - pos.x;
        var dy = follow.y - pos.y;
        look.tx = clamp(dx / (140 * S), -1, 1);
        look.ty = clamp(dy / (140 * S), -1, 1);
      } else if (now >= look.until) {
        if (Math.random() < 0.22) {
          look.tx = 0;
          look.ty = 0;
        } else {
          look.tx = rand(-1, 1);
          look.ty = rand(-0.7, 0.7);
        }
        look.until = now + rand(1.2, 3.4);
      }
      var ltx = clamp(look.tx + cur.lookBiasX, -1.15, 1.15);
      var lty = clamp(look.ty + cur.lookBiasY, -1.15, 1.15);
      look.x = expApproach(look.x, ltx, 6.5, dt);
      look.y = expApproach(look.y, lty, 6.5, dt);
    }

    function updateMotion(dt, now) {
      placeCenter(false);
      // Stay in the center. Subtle bob / breathe only — no wandering.
      var bob = stillMode ? 0 : (Math.sin(now * 2.15) * 4.0 * S + Math.sin(now * 3.6 + 0.4) * 1.6 * S);
      var breathe = stillMode ? 0 : 0.016 * Math.sin(now * 2.15);
      pos.tx = rest.x;
      pos.ty = rest.y + bob;
      var omega = 9.2, zeta = 0.93;
      var ax = omega * omega * (pos.tx - pos.x) - 2 * zeta * omega * pos.vx;
      var ay = omega * omega * (pos.ty - pos.y) - 2 * zeta * omega * pos.vy;
      pos.vx += ax * dt;
      pos.vy += ay * dt;
      pos.x += pos.vx * dt;
      pos.y += pos.vy * dt;
      lean = expApproach(lean, 0.018 * Math.sin(now * 2.7 + flickerN), 6, dt);
      squash = expApproach(squash, breathe, 8, dt);
      flare = Math.max(0, flare - dt * 2.4);
    }

    function approachParams(dt) {
      var rate = 9;
      for (var k in target) {
        if (typeof cur[k] === 'number') cur[k] = expApproach(cur[k], target[k], rate, dt);
      }
    }

    function talkingNow() {
      return talkHeld || exprName === 'talking';
    }

    function updateAuto(dt) {
      if (!autoOn) return;
      autoTimer += dt;
      if (autoTimer >= autoHold) {
        autoTimer = 0;
        var next = pickAutoExpression();
        setExpressionInternal(next, true);
        autoHold = rand(holdRange(next)[0], holdRange(next)[1]);
      }
    }

    function spriteToWorld(sx, sy, xf) {
      // xf: {x, y, scx, scy, ang} applied around FACE
      var dx = sx - FACE_CX;
      var dy = sy - FACE_CY;
      var ca = Math.cos(xf.ang), sa = Math.sin(xf.ang);
      var rx = dx * xf.scx;
      var ry = dy * xf.scy;
      return {
        x: xf.x + rx * ca - ry * sa,
        y: xf.y + rx * sa + ry * ca
      };
    }

    function currentXF() {
      var sc = bodyScale();
      var flickX = 1 + 0.008 * Math.sin(time * 15.4) + 0.005 * Math.sin(time * 27.0 + flickerN);
      var flickY = 1 + 0.014 * Math.sin(time * 12.8 + 0.7) + 0.007 * Math.sin(time * 21.0 + 1.4);
      return {
        x: pos.x,
        y: pos.y,
        scx: sc * (1 + squash * 0.45) * flickX,
        scy: sc * (1 - squash * 0.32) * flickY,
        ang: lean
      };
    }

    function n1(t, s) {
      return Math.sin(t + s) * 0.54 + Math.sin(t * 1.93 + s * 1.7) * 0.31 + Math.sin(t * 3.27 + s * 2.4) * 0.15;
    }

    function spawnEmber(now, xf, sx, sy, extra) {
      sx = sx != null ? sx : rand(SOLID_L + 16, SOLID_R - 16);
      sy = sy != null ? sy : rand(TIP_Y + 10, FACE_CY);
      var p = spriteToWorld(sx, sy, xf);
      embers.push({
        x: p.x, y: p.y,
        vx: rand(-22, 22) * S,
        vy: rand(-70, -28) * S,
        r: rand(1.0, 2.6) * S,
        born: now,
        life: rand(0.4, 1.05),
        hue: Math.random()
      });
      if (extra) embers[embers.length - 1].vy *= 1.25;
    }

    function spawnDrop(now, xf) {
      var src = DRIPS[Math.random() < 0.4 ? 0 : 1];
      drops.push({
        sx: src.x + rand(-4, 4),
        sy: src.y + rand(-2, 3),
        attached: 1,
        stretch: rand(8, 16),
        maxStretch: rand(28, 58),
        vx: 0, vy: 0,
        x: 0, y: 0,
        r: rand(1.8, 3.0),
        born: now,
        life: rand(0.7, 1.25)
      });
    }

    function spawnSmoke(now, xf) {
      var p = spriteToWorld(TIP_X + rand(-22, 26), TIP_Y + rand(-10, 36), xf);
      smokes.push({
        x: p.x, y: p.y,
        vx: rand(-10, 16) * S,
        vy: rand(-28, -10) * S,
        r: rand(7, 16) * S,
        born: now,
        life: rand(1.0, 2.0)
      });
    }

    function spawnTongue(now, kind) {
      var side = kind === 'left' ? -1 : (kind === 'right' ? 1 : (Math.random() < 0.5 ? -1 : 1));
      var fromShoulder = kind === 'left' || kind === 'right' || Math.random() < 0.28;
      var baseX = fromShoulder ? (BULB_CX + side * rand(40, 78)) : (TIP_X + rand(-16, 16));
      var baseY = fromShoulder ? (NECK_Y + rand(-10, 36)) : (TIP_Y + rand(6, 28));
      tongues.push({
        born: now,
        life: rand(0.16, 0.42),
        baseX: baseX,
        baseY: baseY,
        side: side,
        maxLen: rand(36, 86) + flare * 28,
        width: rand(5, 11),
        curl: rand(0.6, 1.4) * side,
        seed: rand(0, 20),
        split: Math.random() < 0.55,
        didSplit: false,
        hot: Math.random() < 0.4
      });
    }

    function spawnBit(now, xf, sx, sy, vx, vy) {
      var p = spriteToWorld(sx, sy, xf);
      bits.push({
        x: p.x, y: p.y,
        vx: (vx != null ? vx : rand(-16, 16)) * S,
        vy: (vy != null ? vy : rand(-50, -18)) * S,
        r: rand(2.2, 5.5),
        rot: rand(0, 6),
        rv: rand(-4, 4),
        born: now,
        life: rand(0.22, 0.55),
        tall: rand(1.3, 2.2)
      });
    }

    function updateParticles(dt, now, xf) {
      if (now >= nextEmber) {
        spawnEmber(now, xf);
        if (Math.random() < 0.55) spawnEmber(now, xf);
        if (flare > 0.2) spawnEmber(now, xf, TIP_X, TIP_Y, true);
        nextEmber = now + rand(0.04, 0.11);
      }
      if (now >= nextDrop) {
        spawnDrop(now, xf);
        nextDrop = now + rand(0.28, 0.85);
      }
      if (now >= nextSmoke) {
        spawnSmoke(now, xf);
        nextSmoke = now + rand(0.18, 0.48);
      }
      if (now >= nextTongue) {
        var k = Math.random();
        spawnTongue(now, k < 0.22 ? 'left' : (k < 0.44 ? 'right' : 'crown'));
        if (Math.random() < 0.45 + flare * 0.4) spawnTongue(now, 'crown');
        nextTongue = now + rand(0.07, 0.16);
      }

      var i;
      for (i = tongues.length - 1; i >= 0; i--) {
        var tg = tongues[i];
        var u = (now - tg.born) / tg.life;
        if (u >= 1) { tongues.splice(i, 1); continue; }
        if (tg.split && !tg.didSplit && u > 0.48) {
          tg.didSplit = true;
          var len = tg.maxLen * (u < 0.45 ? u / 0.45 : (1 - u) / 0.55);
          var tipX = tg.baseX + tg.curl * 22 * n1(now * 9 + tg.seed, 2) + tg.side * len * 0.28;
          var tipY = tg.baseY - len;
          spawnBit(now, xf, tipX, tipY, tg.side * 28, -60);
          if (Math.random() < 0.6) spawnEmber(now, xf, tipX, tipY, true);
        }
      }
      for (i = embers.length - 1; i >= 0; i--) {
        var e = embers[i];
        e.vy -= 22 * S * dt;
        e.vx += n1(now * 8 + i, 3) * 18 * S * dt;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.vx *= (1 - 0.55 * dt);
        if (now - e.born > e.life) embers.splice(i, 1);
      }
      for (i = drops.length - 1; i >= 0; i--) {
        var d = drops[i];
        if (d.attached) {
          d.stretch += (38 + flare * 20) * dt * 60 / 4;
          if (d.stretch >= d.maxStretch || now - d.born > d.life * 0.55) {
            d.attached = 0;
            var pw = spriteToWorld(d.sx, d.sy + d.stretch, xf);
            d.x = pw.x; d.y = pw.y;
            d.vy = 30 * S;
            d.vx = rand(-8, 8) * S;
          }
        } else {
          d.vy += 260 * S * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
        }
        if (now - d.born > d.life) drops.splice(i, 1);
      }
      for (i = smokes.length - 1; i >= 0; i--) {
        var s = smokes[i];
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.r += 10 * S * dt;
        if (now - s.born > s.life) smokes.splice(i, 1);
      }
      for (i = bits.length - 1; i >= 0; i--) {
        var b = bits[i];
        b.vy += 8 * S * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.rot += b.rv * dt;
        b.r *= (1 - 0.8 * dt);
        if (now - b.born > b.life) bits.splice(i, 1);
      }
      while (embers.length > 42) embers.shift();
      while (drops.length > 8) drops.shift();
      while (smokes.length > 12) smokes.shift();
      while (tongues.length > 10) tongues.shift();
      while (bits.length > 14) bits.shift();
    }

    function extractOutline(img) {
      var c = document.createElement('canvas');
      c.width = IMG_W;
      c.height = IMG_H;
      var g = c.getContext('2d');
      g.drawImage(img, 0, 0);
      var data = g.getImageData(0, 0, IMG_W, IMG_H).data;
      function solid(x, y) {
        if (x < 0 || y < 0 || x >= IMG_W || y >= IMG_H) return false;
        var i = ((y | 0) * IMG_W + (x | 0)) * 4;
        // Solid body only — skip the soft glow and the ring.
        return data[i + 3] > 180 && (data[i] + data[i + 1] + data[i + 2]) > 170;
      }
      var pts = [];
      var N = 80;
      for (var k = 0; k < N; k++) {
        var a = -Math.PI / 2 + (k / N) * Math.PI * 2;
        var ca = Math.cos(a), sa = Math.sin(a);
        var hit = 24, r;
        for (r = 16; r < 300; r += 2) {
          if (!solid(BULB_CX + ca * r, BULB_CY + sa * r)) { hit = r - 1; break; }
        }
        pts.push({ a: a, r: hit, ca: ca, sa: sa, upper: sa < -0.05 });
      }
      return pts;
    }

    function makeGlow() {
      var c = document.createElement('canvas');
      var size = 384;
      c.width = c.height = size;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(size / 2, size * 0.52, size * 0.08, size / 2, size * 0.52, size * 0.5);
      grd.addColorStop(0, 'rgba(194,65,12,0.55)');
      grd.addColorStop(0.32, 'rgba(138,42,10,0.32)');
      grd.addColorStop(0.62, 'rgba(70,8,4,0.14)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      return c;
    }

    function makeSoftDot() {
      var c = document.createElement('canvas');
      var size = 96;
      c.width = c.height = size;
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grd.addColorStop(0, 'rgba(255,252,246,0.95)');
      grd.addColorStop(0.35, 'rgba(255,248,230,0.40)');
      grd.addColorStop(1, 'rgba(255,248,230,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      return c;
    }

    function strokeRound(ctx, pts, thick) {
      if (pts.length < 2) return;
      ctx.lineWidth = thick;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    function eyeCenters() {
      var half = (GAP * EYE_D + EYE_D) / 2;
      return { lx: FACE_CX - half, rx: FACE_CX + half, y: FACE_CY };
    }

    function mouthCenterY(curve, width, thick) {
      var eyeBottom = FACE_CY + EYE_D / 2;
      var w = width * EYE_D;
      var t = thick * EYE_D;
      var R = Math.max(2, (w - t) / 2);
      if (curve >= 0) {
        return eyeBottom - R * Math.sin(20 * Math.PI / 180) * Math.max(curve, 0.0001) + t / 2;
      }
      return eyeBottom + R * Math.abs(curve) + t / 2;
    }

    function drawEyeStyle(c, cx, cy, D, kind, dir, rot, open, alpha) {
      if (alpha < 0.04) return;
      c.save();
      c.globalAlpha *= alpha;
      c.translate(cx, cy);
      c.rotate(rot || 0);
      var r = D / 2;
      var thick = D * 0.18;
      c.fillStyle = '#fff';
      c.strokeStyle = '#fff';
      c.lineCap = 'round';
      c.lineJoin = 'round';
      if (kind === 'circle') {
        var ry = r * Math.max(0.08, 1 - open);
        c.beginPath();
        c.ellipse(0, 0, r, ry, 0, 0, Math.PI * 2);
        c.fill();
      } else if (kind === 'happy') {
        // closed happy eye: upward arc
        var pts = [];
        var n = 10, rx = D * 0.46, ry = D * 0.28;
        for (var i = 0; i <= n; i++) {
          var t = i / n;
          var a = Math.PI + t * Math.PI;
          pts.push({ x: Math.cos(a) * rx, y: Math.sin(a) * ry + D * 0.08 });
        }
        strokeRound(c, pts, thick);
      } else if (kind === 'sad') {
        var pts2 = [];
        var n2 = 10, rx2 = D * 0.46, ry2 = D * 0.28;
        for (var j = 0; j <= n2; j++) {
          var t2 = j / n2;
          var a2 = t2 * Math.PI;
          pts2.push({ x: Math.cos(a2) * rx2, y: Math.sin(a2) * ry2 - D * 0.08 });
        }
        strokeRound(c, pts2, thick);
      } else if (kind === 'caret') {
        var h = D * 0.28, w = D * 0.42;
        strokeRound(c, [{ x: -w, y: h * 0.3 }, { x: 0, y: -h }, { x: w, y: h * 0.3 }], thick * 1.05);
      } else if (kind === 'chev') {
        var s = D * 0.38 * (dir || 1);
        strokeRound(c, [
          { x: -s * 0.15, y: -s * 0.85 },
          { x: s * 0.7, y: 0 },
          { x: -s * 0.15, y: s * 0.85 }
        ], thick * 1.05);
      } else if (kind === 'ex') {
        var k = D * 0.36;
        strokeRound(c, [{ x: -k, y: -k }, { x: k, y: k }], thick);
        strokeRound(c, [{ x: k, y: -k }, { x: -k, y: k }], thick);
      } else if (kind === 'flat') {
        strokeRound(c, [{ x: -D * 0.42, y: 0 }, { x: D * 0.42, y: 0 }], thick * 1.05);
      } else if (kind === 'slit') {
        var sl = D * 0.48;
        strokeRound(c, [{ x: -sl, y: 0 }, { x: sl, y: 0 }], thick * 0.95);
      }
      c.restore();
    }

    function drawBrows(c, lx, rx, y, D, amt) {
      if (amt < 0.05) return;
      c.save();
      c.globalAlpha *= amt;
      c.strokeStyle = '#fff';
      var thick = D * 0.11;
      // inner ends raised (worried)
      var lift = D * 0.16;
      var out = D * 0.22;
      var up = -D * 0.58;
      strokeRound(c, [
        { x: lx - out, y: y + up + lift * 0.2 },
        { x: lx + out * 0.9, y: y + up - lift }
      ], thick);
      strokeRound(c, [
        { x: rx + out, y: y + up + lift * 0.2 },
        { x: rx - out * 0.9, y: y + up - lift }
      ], thick);
      c.restore();
    }

    function drawMouth(c, p, tNow) {
      var width = p.mouthW * EYE_D;
      var thick = p.mouthThick * EYE_D;
      var curve = p.mouthCurve;
      var open = p.mouthOpen;
      if (talkingNow()) {
        var pulse = 0.38 + 0.62 * Math.abs(Math.sin(tNow * 10.5));
        open = Math.max(open, 0.55 * pulse + 0.15);
        curve = lerp(curve, 0.35, 0.7);
        width = lerp(width, 0.62 * EYE_D, 0.5);
      }
      var mx = FACE_CX;
      var my = mouthCenterY(curve, width / EYE_D, thick / EYE_D);

      c.strokeStyle = '#fff';
      c.fillStyle = '#fff';

      if (open > 0.08) {
        var rx = width * 0.42;
        var ry = EYE_D * (0.10 + 0.22 * open);
        var oy = FACE_CY + EYE_D / 2 + ry * 0.15 + thick * 0.2;
        c.lineWidth = Math.max(1.5, thick * 0.55);
        c.beginPath();
        c.ellipse(mx, oy, rx, ry, 0, 0, Math.PI * 2);
        c.stroke();
        return;
      }

      if (p.mouthWave > 0.08 && Math.abs(curve) < 0.85) {
        var pts = [];
        var n = 16;
        var half = width / 2;
        var amp = EYE_D * 0.14 * p.mouthWave;
        var y0 = FACE_CY + EYE_D / 2 + thick / 2;
        for (var i = 0; i <= n; i++) {
          var t = i / n;
          var x = mx - half + t * width;
          var y = y0 + Math.sin(t * Math.PI * 2) * amp;
          pts.push({ x: x, y: y });
        }
        strokeRound(c, pts, thick);
        return;
      }

      if (Math.abs(curve) < 0.12) {
        // flat unamused line, top at the eye line
        var yLine = FACE_CY + EYE_D / 2 + thick / 2;
        strokeRound(c, [
          { x: mx - width / 2, y: yLine },
          { x: mx + width / 2, y: yLine }
        ], thick);
        return;
      }

      var R = Math.max(2, (width - thick) / 2);
      var pts2 = [];
      var n2 = 18;
      var a0, a1, ry;
      if (curve > 0) {
        a0 = 20; a1 = 160;
        ry = R * Math.min(1, 0.55 + 0.45 * curve);
      } else {
        a0 = 200; a1 = 340;
        ry = R * Math.min(1, 0.55 + 0.45 * Math.abs(curve));
      }
      for (var j = 0; j <= n2; j++) {
        var u = j / n2;
        var a = (a0 + (a1 - a0) * u) * Math.PI / 180;
        pts2.push({ x: mx + Math.cos(a) * R, y: my + Math.sin(a) * ry });
      }
      strokeRound(c, pts2, thick);
    }

    function drawFace(c, tNow) {
      var eyes = eyeCenters();
      // Look: shift the whole face a little, staying inside the bulb.
      var maxLook = EYE_D * 0.28;
      var ox = look.x * maxLook;
      var oy = look.y * maxLook * 0.85;
      c.save();
      c.translate(ox, oy);

      var D = EYE_D;
      var open = blink;

      // Soft pre-rendered glow under features (no per-frame filters).
      if (softDot) {
        var gs = D * 2.6;
        c.globalAlpha = 0.55;
        c.drawImage(softDot, eyes.lx - gs / 2, eyes.y - gs / 2, gs, gs);
        c.drawImage(softDot, eyes.rx - gs / 2, eyes.y - gs / 2, gs, gs);
        var mg = D * 1.8;
        c.drawImage(softDot, FACE_CX - mg / 2, FACE_CY + D * 0.25 - mg / 2, mg, mg);
        c.globalAlpha = 1;
      }

      function pair(kind, lAmt, rAmt, lDir, rDir, lRot, rRot) {
        drawEyeStyle(c, eyes.lx, eyes.y, D, kind, lDir, lRot, open, lAmt);
        drawEyeStyle(c, eyes.rx, eyes.y, D, kind, rDir, rRot, open, rAmt);
      }

      pair('circle', cur.lCircle, cur.rCircle, 1, 1, 0, 0);
      pair('happy', cur.lHappy, cur.rHappy, 1, 1, 0, 0);
      pair('sad', cur.lSad, cur.rSad, 1, 1, 0, 0);
      pair('caret', cur.lCaret, cur.rCaret, 1, 1, 0, 0);
      pair('chev', cur.lChev, cur.rChev, cur.lChevDir, cur.rChevDir, 0, 0);
      pair('ex', cur.lEx, cur.rEx, 1, 1, 0, 0);
      pair('flat', cur.lFlat, cur.rFlat, 1, 1, 0, 0);
      pair('slit', cur.lSlit, cur.rSlit, 1, 1, cur.lSlitRot, cur.rSlitRot);
      drawBrows(c, eyes.lx, eyes.rx, eyes.y, D, cur.brow);
      drawMouth(c, cur, tNow);
      c.restore();
    }

    function drawWarpedTip(c, tNow) {
      // Warp the painted crown as one piece around the neck so the tip
      // whips, stretches and curls without striping. Face stays planted.
      if (!bodyImg) return;
      var sway = 20 * n1(tNow * 11.2, 1.1) + 12 * n1(tNow * 6.3, 5.4);
      var stretch = 1 + 0.18 * n1(tNow * 8.4, 3.2) + 0.05 * flare;
      var curl = 0.16 * n1(tNow * 7.2, 2.1) + 0.07 * n1(tNow * 13.5, 4.8);
      c.save();
      c.translate(TIP_X + sway * 0.35, NECK_Y);
      c.rotate(curl);
      c.scale(1 + Math.abs(sway) * 0.001, stretch);
      c.translate(-(TIP_X + sway * 0.35), -NECK_Y);
      // Deep overlap past the neck so rotation never leaves a gap.
      c.drawImage(bodyImg, 0, 0, IMG_W, NECK_Y + 36, 0, 0, IMG_W, NECK_Y + 36);
      c.restore();
    }

    function drawRim(c, tNow) {
      if (!outline || !outline.length) return;
      c.save();
      c.lineJoin = 'round';
      c.lineCap = 'round';
      var layers = [
        { w: 8, col: 'rgba(255,110,30,0.20)', amp: 1.1 },
        { w: 4.2, col: 'rgba(255,190,80,0.48)', amp: 1.0 },
        { w: 1.8, col: 'rgba(255,244,210,0.70)', amp: 0.85 }
      ];
      var li, i, pt, a, r, u, disp;
      for (li = 0; li < layers.length; li++) {
        var L = layers[li];
        c.strokeStyle = L.col;
        c.lineWidth = L.w;
        c.beginPath();
        for (i = 0; i < outline.length; i++) {
          pt = outline[i];
          u = pt.upper ? 1 : 0.28;
          disp = n1(tNow * 12.4 + i * 0.37, 0.7) * 6 * u * L.amp
            + n1(tNow * 7.1 + i * 0.18, 2.8) * 4 * u * L.amp
            + flare * 4 * u;
          r = pt.r + disp;
          a = pt.a + n1(tNow * 8.2 + i * 0.2, 4.4) * 0.02 * u;
          var x = BULB_CX + Math.cos(a) * r;
          var y = BULB_CY + Math.sin(a) * r;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.closePath();
        c.stroke();
      }
      c.restore();
    }

    function drawTongues(c, tNow) {
      c.save();
      c.lineCap = 'round';
      c.lineJoin = 'round';
      var i;
      for (i = 0; i < tongues.length; i++) {
        var tg = tongues[i];
        var u = clamp((tNow - tg.born) / tg.life, 0, 1);
        // grow quickly, then taper off — like the gif's short lick cycles
        var env = u < 0.4 ? u / 0.4 : Math.max(0, 1 - (u - 0.4) / 0.6);
        env = env * env * (3 - 2 * env);
        var len = tg.maxLen * env;
        if (len < 4) continue;
        var wob = n1(tNow * 10 + tg.seed, 1.5);
        var tipX = tg.baseX + tg.curl * (16 + len * 0.35) * (0.6 + 0.4 * wob) + n1(tNow * 14 + tg.seed, 3) * 8;
        var tipY = tg.baseY - len;
        var midX = tg.baseX + (tipX - tg.baseX) * 0.45 + n1(tNow * 9 + tg.seed, 2.2) * 12;
        var midY = tg.baseY - len * 0.5;
        var w = tg.width * (0.55 + 0.45 * env);
        c.strokeStyle = tg.hot
          ? ('rgba(255,244,210,' + (0.55 + 0.35 * env) + ')')
          : ('rgba(255,170,70,' + (0.40 + 0.35 * env) + ')');
        c.lineWidth = w;
        c.beginPath();
        c.moveTo(tg.baseX, tg.baseY);
        c.quadraticCurveTo(midX, midY, tipX, tipY);
        c.stroke();
        if (tg.hot) {
          c.strokeStyle = 'rgba(255,250,230,0.7)';
          c.lineWidth = w * 0.35;
          c.beginPath();
          c.moveTo(tg.baseX, tg.baseY);
          c.quadraticCurveTo(midX, midY, tipX, tipY);
          c.stroke();
        }
      }
      c.restore();
    }

    function drawAttachedDrips(c, tNow, xf) {
      var i, d;
      c.save();
      c.fillStyle = 'rgba(255,170,70,0.95)';
      c.strokeStyle = 'rgba(255,200,110,0.85)';
      c.lineCap = 'round';
      for (i = 0; i < drops.length; i++) {
        d = drops[i];
        if (!d.attached) continue;
        var w = Math.max(1.2, d.r * (1 - d.stretch / (d.maxStretch + 8)));
        c.lineWidth = w;
        c.beginPath();
        c.moveTo(d.sx, d.sy);
        c.lineTo(d.sx + n1(tNow * 6, i) * 1.5, d.sy + d.stretch);
        c.stroke();
        c.beginPath();
        c.ellipse(d.sx, d.sy + d.stretch, w * 0.7, w * 1.15, 0, 0, Math.PI * 2);
        c.fill();
      }
      c.restore();
    }

    function drawLicks(c, tNow) {
      drawTongues(c, tNow);
    }

    function drawParticles(c, now, xf) {
      var i, a, e, d, s, b;
      for (i = 0; i < smokes.length; i++) {
        s = smokes[i];
        a = 1 - (now - s.born) / s.life;
        a = a * a * 0.16;
        if (a <= 0) continue;
        c.fillStyle = 'rgba(70,36,28,' + a + ')';
        c.beginPath();
        c.ellipse(s.x, s.y, s.r, s.r * 1.2, 0, 0, Math.PI * 2);
        c.fill();
      }
      for (i = 0; i < bits.length; i++) {
        b = bits[i];
        a = 1 - (now - b.born) / b.life;
        a = Math.max(0, a);
        c.save();
        c.translate(b.x, b.y);
        c.rotate(b.rot);
        c.fillStyle = 'rgba(255,190,90,' + (0.85 * a) + ')';
        c.beginPath();
        c.ellipse(0, 0, b.r * 0.55, b.r * b.tall, 0, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
      for (i = 0; i < embers.length; i++) {
        e = embers[i];
        a = 1 - (now - e.born) / e.life;
        a = Math.max(0, a);
        var col = e.hue < 0.45 ? '255,230,160' : (e.hue < 0.8 ? '255,180,80' : '255,255,230');
        c.fillStyle = 'rgba(' + col + ',' + (0.9 * a) + ')';
        c.beginPath();
        c.arc(e.x, e.y, e.r * (0.7 + 0.3 * a), 0, Math.PI * 2);
        c.fill();
      }
      for (i = 0; i < drops.length; i++) {
        d = drops[i];
        if (d.attached) continue;
        a = 1 - (now - d.born) / d.life;
        a = Math.max(0, a);
        c.fillStyle = 'rgba(255,170,70,' + (0.92 * a) + ')';
        c.beginPath();
        c.ellipse(d.x, d.y, d.r * 0.55 * S, d.r * 1.45 * S, 0, 0, Math.PI * 2);
        c.fill();
      }
    }

    function drawFaceLayer(now, xf) {
      ctx.save();
      ctx.translate(xf.x, xf.y);
      ctx.rotate(xf.ang);
      ctx.scale(xf.scx, xf.scy);
      ctx.translate(-FACE_CX, -FACE_CY);
      drawAttachedDrips(ctx, now, xf);
      drawFace(ctx, now);
      ctx.restore();
      drawParticles(ctx, now, xf);
    }

    function drawEcho(now) {
      var xf = currentXF();
      if (glOk) {
        renderFlameGL(now, xf);
        return;
      }
      if (!ready || !bodyImg) return;

      ctx.save();
      ctx.translate(xf.x, xf.y);
      ctx.rotate(xf.ang);
      ctx.scale(xf.scx, xf.scy);
      ctx.translate(-FACE_CX, -FACE_CY);

      // Irregular glow pulse (pre-rendered, no CSS/canvas filters).
      if (glowCvs) {
        var pulse = 0.62
          + 0.20 * (0.5 + 0.5 * Math.sin(now * 2.05))
          + 0.12 * n1(now * 5.6, 1.3)
          + 0.10 * flare;
        pulse = clamp(pulse, 0.45, 1.05);
        var gw = (SOLID_W + 270);
        var gh = gw * (1 + 0.04 * n1(now * 3.4, 2));
        ctx.globalAlpha = pulse;
        ctx.drawImage(glowCvs, BULB_CX - gw / 2, BULB_CY - gh * 0.46, gw, gh);
        ctx.globalAlpha = 1;
      }

      // Lower body (bulb, face area, painted drips) stays planted.
      // Brightness flicker on the painted body, no filters.
      var bodyA = 0.88 + 0.12 * (0.5 + 0.5 * n1(now * 14.2, 0.6)) + 0.06 * flare;
      ctx.globalAlpha = clamp(bodyA, 0.82, 1);
      var dripStretch = 1 + 0.04 * n1(now * 6.2, 2.4);
      // Full body first so a whipping tip can never open a hole at the neck.
      ctx.drawImage(bodyImg, 0, 0, IMG_W, IMG_H);
      var mid = NECK_Y + 8;
      ctx.drawImage(bodyImg, 0, mid, IMG_W, IMG_H - mid, 0, mid, IMG_W, (IMG_H - mid) * dripStretch);
      drawWarpedTip(ctx, now);
      ctx.globalAlpha = 1;

      drawRim(ctx, now);
      drawLicks(ctx, now);
      drawAttachedDrips(ctx, now, xf);
      drawFace(ctx, now);
      ctx.restore();

      drawParticles(ctx, now, xf);
    }

    function update(dt, now) {
      updateBlink(dt, now);
      updateLook(dt, now);
      updateMotion(dt, now);
      approachParams(dt);
      updateAuto(dt);
      if (pokeUntil && now >= pokeUntil) pokeUntil = 0;
      var xf = currentXF();
      updateParticles(dt, now, xf);
    }

    function draw(now) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var xf = currentXF();
      if (glOk) {
        ctx.clearRect(0, 0, W, H);
        renderFlameGL(now, xf);
        drawFaceLayer(now, xf);
      } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        drawEcho(now);
      }
      if (debugOn) {
        fpsAcc += 1;
        if (now - (fpsFrames || now) >= 0.5) {
          fpsVal = Math.round(fpsAcc / Math.max(0.001, now - fpsFrames));
          fpsFrames = now;
          fpsAcc = 0;
          fpsEl.textContent = fpsVal + ' fps';
        }
        if (!fpsFrames) fpsFrames = now;
      }
    }

    function loop(ts) {
      requestAnimationFrame(loop);
      var now = ts * 0.001;
      var dt = last ? Math.min(0.05, now - last) : 0.016;
      last = now;
      time = now;
      update(dt, now);
      // Cap draws at 60fps (iPhone ProMotion can be 120).
      if (lastDraw && (now - lastDraw) < 0.0155) return;
      lastDraw = now;
      draw(now);
    }

    function clientPoint(ev) {
      var x, y;
      if (ev.touches && ev.touches[0]) {
        x = ev.touches[0].clientX;
        y = ev.touches[0].clientY;
      } else {
        x = ev.clientX;
        y = ev.clientY;
      }
      return { x: x, y: y };
    }

    var pointerDown = false;
    var pointerId = null;
    var downAt = 0;
    var downPt = { x: 0, y: 0 };
    var moved = false;

    function hitRadius() {
      return extents().left * 1.05;
    }

    function onDown(ev) {
      if (ev.target && ev.target.closest && ev.target.closest('#bar')) return;
      var p = clientPoint(ev);
      pointerDown = true;
      moved = false;
      downAt = time;
      downPt = p;
      if (ev.pointerId != null) {
        pointerId = ev.pointerId;
        try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
      }
      var dist = Math.hypot(p.x - pos.x, p.y - pos.y);
      look.tx = clamp((p.x - pos.x) / (80 * S), -1, 1);
      look.ty = clamp((p.y - pos.y) / (80 * S), -1, 1);
      look.until = time + 1.6;
      if (dist < hitRadius() * 1.2) {
        pokeUntil = time + 0.7;
        var ang = Math.atan2(pos.y - p.y, pos.x - p.x);
        pos.vx += Math.cos(ang) * 46 * S;
        pos.vy += Math.sin(ang) * 46 * S;
        squash = 0.14;
        flare = 1;
        spawnTongue(time, 'crown');
        spawnTongue(time, Math.random() < 0.5 ? 'left' : 'right');
        var xf0 = currentXF();
        spawnEmber(time, xf0, TIP_X, TIP_Y, true);
        spawnEmber(time, xf0, TIP_X, TIP_Y, true);
      }
    }

    function onMove(ev) {
      if (!pointerDown) return;
      var p = clientPoint(ev);
      if (Math.hypot(p.x - downPt.x, p.y - downPt.y) > 8) moved = true;
      look.tx = clamp((p.x - pos.x) / (100 * S), -1, 1);
      look.ty = clamp((p.y - pos.y) / (100 * S), -1, 1);
      look.until = time + 1.2;
    }

    function onUp(ev) {
      if (!pointerDown) return;
      pointerDown = false;
      pointerId = null;
    }

    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    window.addEventListener('blur', onUp);

    document.addEventListener('touchmove', function (e) {
      if (e.target && e.target.closest && e.target.closest('#pills')) return;
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 80); });

    window.echoFace = {
      setExpression: function (name) { return setExpressionInternal(name, false); },
      talk: function (on) { talkHeld = !!on; },
      setAuto: function (on) { setAuto(on); },
      getExpression: function () { return exprName; },
      expressions: EXPRESSION_NAMES.slice()
    };

    buildUI();
    softDot = makeSoftDot();
    glOk = initFlameGL();
    if (glOk) {
      canvas.style.background = 'transparent';
    } else if (flameCanvas) {
      flameCanvas.style.display = 'none';
    }
    resize();
    setExpressionInternal(startName, true);
    if (autoOn) setAuto(true);
    blinkUntil = rand(0.8, 2.0);
    flickerN = Math.random() * 10;
    nextEmber = 0.05;
    nextDrop = 0.25;
    nextSmoke = 0.12;
    nextTongue = 0.02;

    var started = false;
    function startLoop() {
      if (started) return;
      started = true;
      ready = true;
      requestAnimationFrame(function (ts) {
        last = ts * 0.001;
        requestAnimationFrame(loop);
      });
    }

    if (glOk) startLoop();

    var img = new Image();
    img.onload = function () {
      bodyImg = img;
      glowCvs = makeGlow();
      outline = extractOutline(img);
      ready = true;
      startLoop();
    };
    img.onerror = function () {
      glowCvs = makeGlow();
      ready = true;
      startLoop();
    };
    img.src = 'assets/flame-body.png';
  })();
  </script>
</body>
</html>
